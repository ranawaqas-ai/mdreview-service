<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A public document (#101) is "anyone with the link", NOT search-indexed: noindex the viewer.
     Belt-and-suspenders with the X-Robots-Tag header the server sends on this route. Harmless for
     private docs (only ever served to their owner; a crawler can only reach a public one). -->
<meta name="robots" content="noindex, nofollow">
<title>mdreview</title>
<script>
/* #285 pre-paint theme applier — IDENTICAL in all five page heads (dashboard, viewer,
   latex-viewer, account, admin); edit all five together. It must run synchronously in <head>,
   before first paint: account.js (which renders the toggle) is end-of-body and too late, and a
   deferred applier would flash the wrong theme. An explicit stored choice pins data-theme;
   anything else (key absent, garbage value, storage unavailable) means auto: attribute off,
   CSS follows the OS. */
(function(){try{var t=localStorage.getItem("mdr.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/katex.min.css">
<link rel="stylesheet" href="/static/hljs-github.css">
<link rel="stylesheet" href="/static/theme.css">
<style>
  /* Colour tokens live in /static/theme.css (#153/#277) — never redefine them per page.
     Rev 3 (#279): every colour on this page resolves through the token contract; the page holds
     ZERO colour literals (tests/css_palette_selfcheck.js enforces it). The legacy --blue is gone
     from this page (rev 3 has no blue); --noteline = the comment margin bar (accent violet). */
  *{box-sizing:border-box;}
  /* Rev 3 reading measure: Source Serif 4 18px/1.7 (was Charter 20px). */
  /* 20px, not 18px: #279 shrank the reading measure as part of the re-skin; the owner reverted
     it 2026-08-05. Kept alongside --font-serif so the face and its size move together. */
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-serif);font-size:20px;line-height:1.7;}
  /* #199: the reading column yields so the comment rail can sit beside the text.
     The rail needs `#article.right + 320 <= innerWidth`. With .wrap centred that reduces to
     `column <= W - 592` (rail 284 + gap 24 + the 24/64 padding either side). Reserving 620
     leaves ~28px of headroom rather than sitting on the exact fit, so a scrollbar, a rounding
     change or a later font-metric shift does not flip the layout back and forth.
     Above ~1340px the min() yields 720px, so WIDE LAYOUTS ARE UNCHANGED — the column only
     narrows in the band where the alternative was docking the rail on top of the text.
     The 320px floor keeps genuinely narrow viewports readable; there the rail docks, as before. */
  .wrap{max-width:clamp(320px, calc(100vw - 620px), 720px);margin:0 auto;padding:40px 24px 160px 64px;}
  /* full-width sticky top bar (rev 3): ← Reviews │ [MD] project / source_path (left), controls (right) */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 26px;border-bottom:1px solid var(--border-faint);background:var(--bg);font-family:var(--font-ui);font-size:13px;}
  .topbar .tb-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar .home{color:var(--text-muted);text-decoration:none;font-weight:500;white-space:nowrap;}
  .topbar .home:hover{color:var(--text);}
  .topbar .tb-sep{color:var(--border);}
  /* kind chip: static "MD" on this page (the latex viewer carries its own kind) */
  .kindchip{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--text-subtle);padding:2px 6px;border:1px solid var(--border);border-radius:6px;}
  .filename{font-family:var(--font-mono);font-size:12px;color:var(--text-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-right{font-size:12px;color:var(--text-muted);letter-spacing:.03em;white-space:nowrap;}
  /* eyebrow above the title (rev 3): project · vN · pushed <ago>, present segments only */
  .breadcrumb{font-family:var(--font-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 16px;}
  .breadcrumb:empty{display:none;}
  /* rendered markdown (rev 3: serif body, Geist sentence-case headings — the old uppercase --blue
     eyebrow h2 is retired; headings are USER content, so this stays presentation-only) */
  #article h1{font-size:32px;line-height:1.15;letter-spacing:-.02em;margin:.2em 0 .3em;font-weight:600;}
  #article h2{font-family:var(--font-ui);font-size:16px;letter-spacing:-.01em;margin:0;font-weight:600;}
  #article h3{font-family:var(--font-ui);font-size:14px;letter-spacing:-.01em;margin:0;font-weight:600;}
  #article h4,#article h5,#article h6{font-family:var(--font-ui);font-size:13px;margin:0;font-weight:600;}
  #article p{margin:0;}
  #article ul,#article ol{margin:0;padding-left:1.4em;}
  #article li{margin:.2em 0;}
  #article blockquote{margin:0;padding:2px 0 2px 16px;border-left:2px solid var(--border);color:var(--text-muted);font-style:italic;}
  #article pre{background:var(--code-bg);padding:14px;border-radius:var(--r-control);overflow:auto;font-size:13px;line-height:1.65;}
  #article code{font-family:var(--font-mono);font-size:.85em;}
  #article a{color:var(--accent);}
  #article table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px;line-height:1.45;display:block;overflow-x:auto;}
  #article th,#article td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top;}
  #article th{background:var(--code-bg);font-weight:600;}
  #article tr:nth-child(even) td{background:color-mix(in srgb,var(--text) 3%,transparent);}
  /* Images get a near-white "paper" mat so a light-authored figure stays legible on a dark pane
     instead of smearing into it (theme-awareness / MR-027). Keep this IMAGE-ONLY — never widen to
     #article > *: mermaid (.mermaid svg, inline, JS-themed) and KaTeX (.katex spans) theme
     themselves and a mat would fight them; an <img> is an opaque box we can't introspect, and the
     pane's color-scheme can't reach an <img>-loaded SVG. .histdoc img covers the history-modal
     drafts. Supported direction: light-authored figures; a dark/transparent figure on the mat is a
     known non-goal (it can go invisible) — see epics/theme-awareness-plan.md. */
  #article img, .histdoc img{max-width:100%;background:var(--paper);padding:8px;border-radius:var(--r-control);}
  #article img{cursor:zoom-in;}
  #lightbox{display:none;position:fixed;inset:0;z-index:100;background:var(--scrim);align-items:center;justify-content:center;cursor:zoom-out;padding:16px;}
  #lightbox img{max-width:96vw;max-height:96vh;background:var(--paper);border-radius:var(--r-control);box-shadow:var(--shadow-paper);}
  /* GFM footnotes: marked-footnote appends a footnotes section at the end of the article, led by a
     screen-reader-only heading. The viewer has no .sr-only rule otherwise, so without the clip rule
     below that heading renders as a full-size accent banner. */
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px;}
  #article .footnotes{margin-top:32px;border-top:1px solid var(--border);padding-top:6px;font-size:15px;color:var(--text-muted);}
  #article .footnotes ol{padding-left:1.2em;}
  #article sup a,#article .footnotes a{color:var(--accent);text-decoration:none;}
  #article hr{border:none;border-top:1px solid var(--border);margin:8px 0;}
  /* rev 3 title block: serif display title, then a meta line (turn dot · open count · words/min) */
  #doctitle{font-family:var(--font-serif);font-size:40px;line-height:1.12;letter-spacing:-.02em;margin:4px 0 10px;font-weight:600;}
  #doctitle:empty{display:none;}
  #docmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--font-ui);font-size:13px;color:var(--text-muted);padding:0 0 24px;border-bottom:1px solid var(--border-faint);margin:0 0 32px;}
  #docmeta:empty{display:none;}
  #docmeta .turn{display:inline-flex;align-items:center;gap:6px;}
  #docmeta .tdot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;}
  #docmeta .msep{color:var(--text-subtle);}
  #docmeta .mwords{font-family:var(--font-mono);font-size:13px;color:var(--text-subtle);}
  #article .mermaid{margin:10px 0;text-align:center;}
  #article .mermaid svg{max-width:100%;height:auto;}
  /* block wrapper + margin number */
  .blk{position:relative;padding:6px 0;margin:16px 0;border-radius:var(--r-control);transition:background .15s;}
  .blk:hover{background:color-mix(in srgb,var(--text) 4%,transparent);}
  .blk .num{position:absolute;left:-46px;top:9px;width:32px;text-align:right;font-family:var(--font-ui);font-size:11.5px;color:var(--text-subtle);cursor:pointer;user-select:none;opacity:.5;font-variant-numeric:tabular-nums;}
  .blk .num:hover{opacity:1;color:var(--accent);}
  .blk.has-note{box-shadow:inset 3px 0 0 var(--noteline);background:color-mix(in srgb,var(--accent) 5%,transparent);}
  .blk.has-note .num::after{content:" \25CF";color:var(--noteline);}
  @media (max-width:820px){.blk .num{left:-30px;width:22px;font-size:11px;}.wrap{padding-left:40px;}}
  #addbtn{position:absolute;z-index:50;display:none;background:var(--accent);color:var(--bg);border:none;border-radius:var(--r-control);padding:6px 12px;font-family:var(--font-ui);font-size:13px;cursor:pointer;box-shadow:var(--shadow-menu);}
  /* Issue #44: composer floats beside the article (positionPop), where the gutter cards live. width
     284px (was 330) = the .gcard width, so it fits inside the wide gate's envelope — left is rect.right+24
     and the gate needs innerWidth >= rect.right+320, so 24+284=308 < 320 — instead of overflowing the edge. */
  /* rev 3 composer: dashed accent border + left-ruled serif quote + visible ⌘↵ hint */
  #pop{position:fixed;z-index:60;display:none;width:284px;background:var(--surface);border:1px dashed var(--accent);border-radius:var(--r-card);box-shadow:var(--shadow-menu);padding:14px;}
  /* narrow fallback: dock (mirrors #gutter.docked); auto!important beats the wide branch's inline left/top.
     .top docks upper-right instead, chosen opposite the anchor so the composer never covers it (issue #44 AC3). */
  #pop.docked{right:18px;bottom:70px;top:auto!important;left:auto!important;width:360px;}
  #pop.docked.top{top:18px!important;bottom:auto;}
  #pop .q{font-family:var(--font-serif);font-size:13px;line-height:1.6;color:var(--text-muted);border-left:2px solid var(--accent);padding:2px 0 2px 10px;margin:0 0 10px;max-height:64px;overflow:auto;}
  #pop textarea{width:100%;min-height:74px;font-family:var(--font-ui);font-size:14px;border:1px solid var(--border);border-radius:var(--r-control);padding:8px;background:var(--bg);color:var(--text);resize:vertical;}
  #pop .row{display:flex;gap:8px;align-items:center;margin-top:10px;}
  #pop .popkbd{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--text-subtle);}
  .btn{font-family:var(--font-ui);font-size:13px;border-radius:var(--r-control);padding:7px 14px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .btn:hover{border-color:var(--text-subtle);}
  /* #152 slice B: primary buttons use the app-wide brand violet (--accent) with --bg text, matching
     Basecoat's --primary/--primary-foreground on the other pages (and the viewer's own #addbtn/#toast,
     already violet). --bg text (not #fff) keeps contrast correct in dark mode, where --accent is a light
     violet. The viewer stays off Basecoat's CSS on purpose: its Tailwind preflight strips list markers
     from the bespoke serif prose (verified), and every viewer control already reads the shared tokens. */
  .btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);}
  .btn.primary:hover{filter:brightness(1.06);border-color:var(--accent);}
  /* Rev 3 dock: fixed bottom-CENTRE (was bottom-right), translucent over blur. GEOMETRY CONTRACT
     (#279 AC16): #gutter.docked / #pop.docked / #resolved sit at bottom:70px to clear this dock, so
     with bottom:24px the bar's total height must stay <= 46px (here: 32px segments + 2*4px padding
     + 2*1px border = 42px, 4px slack). Grow the dock and you re-derive that clearance. */
  #dock{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:55;font-family:var(--font-ui);}
  #dockbar{display:flex;gap:4px;align-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--border);border-radius:var(--r-card);padding:4px;box-shadow:var(--shadow-dock);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  #count{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;font-family:var(--font-mono);font-size:12px;color:var(--text);white-space:nowrap;}
  #count .cdot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;}
  #dockbar .dsep{width:1px;height:18px;background:var(--border);}
  #dockbar .btn{height:32px;padding:0 12px;border:0;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;border-radius:var(--r-control);}
  #dockbar .btn:hover{background:var(--code-bg);color:var(--text);border:0;}
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;background:var(--accent);color:var(--bg);font-family:var(--font-ui);font-size:13px;padding:8px 16px;border-radius:var(--r-card);box-shadow:var(--shadow-menu);opacity:0;transition:opacity .25s;pointer-events:none;}
  /* #287: an action toast has to be clickable (the default explicitly is not) and outlive a
     plain toast's fade, or the action is decorative. .resolve is the "Comment resolved · undo"
     skin: a fixed dark chip in BOTH themes (--resolve-chip-*, see theme.css), distinct from the
     ordinary accent toast above it in the cascade — .hasaction alone (no .resolve) stays
     available for a future action toast that SHOULD track the page theme. */
  #toast.hasaction{pointer-events:auto;display:flex;align-items:center;gap:var(--s-3);}
  #toast.hasaction .toastbtn{font:inherit;background:none;border:none;cursor:pointer;padding:0;}
  #toast.hasaction.resolve{background:var(--resolve-chip-bg);color:var(--resolve-chip-text);border-radius:var(--r-control);padding:var(--s-3) 16px;}
  #toast.hasaction.resolve .toastbtn{font-family:var(--font-mono);font-size:11px;color:var(--resolve-chip-accent);}
  #toast.hasaction.resolve .toastbtn:hover{text-decoration:underline;}
  /* MR-006/MR-036: Google-Docs style margin comments (threaded), rev-3 card skin.
     (.gcard.addressed and .gcard .gx were dead CSS with no JS setter, removed by #279. #331
     reinstates an ADDRESSED indicator with real semantics as .gentry .gaddr, below — a per-entry
     badge driven by threadHtml()'s isAddressed() derivation, not a static card-level class.) */
  #gutter{position:absolute;top:0;width:284px;z-index:5;display:none;}
  body.gutter-on #cmtbtn{display:none;}
  /* rail header: written by renderAll() from the same pass as the dock counts (#279 AC23) */
  #gutter .ghdr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle);position:absolute;width:284px;padding:0 2px;}
  #gutter.docked .ghdr{position:static;width:auto;padding:0 2px 10px;}
  .gcard{position:absolute;width:284px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:12px;font-family:var(--font-ui);font-size:13px;line-height:1.5;box-shadow:var(--shadow-hair);transition:top .18s ease,box-shadow .15s,border-color .15s;cursor:default;}
  .gcard:hover,.gcard.active{box-shadow:var(--shadow-menu);border-color:var(--accent);}
  .gcard .gref{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);font-weight:600;}
  /* the quoted anchor as the mock's left-ruled serif quote (#279 AC8); content still qsnippet() */
  .gcard .gq,.rcard .gq{display:block;border-left:2px solid var(--accent);padding:2px 0 2px 10px;margin:2px 0 10px;font-family:var(--font-serif);font-size:13px;line-height:1.6;color:var(--text-muted);font-style:normal;max-height:48px;overflow:hidden;}
  mark.cmt{background:var(--accent-muted);box-shadow:inset 0 -1px 0 var(--accent);color:inherit;border-radius:2px;padding:1px 2px;cursor:pointer;transition:background .15s;}
  mark.cmt.active{background:color-mix(in srgb,var(--accent) 24%,var(--bg));}
  #histmodal{display:none;position:fixed;inset:0;z-index:85;background:var(--scrim);align-items:center;justify-content:center;}
  #histbox{width:min(720px,92vw);max-height:82vh;overflow:auto;background:var(--surface-raised);border-radius:var(--r-card);box-shadow:var(--shadow-menu);padding:18px;font-family:var(--font-ui);font-size:13.5px;}
  #histbox h3{margin:0 0 12px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);}
  .histlist{display:flex;flex-direction:column;gap:6px;}
  .histitem{text-align:left;font:inherit;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:var(--r-control);padding:8px 10px;cursor:pointer;}
  .histitem:hover{border-color:var(--accent);}
  #histview h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);}
  #histview ul{margin:4px 0;padding-left:1.2em;}
  .histdoc{border:1px solid var(--border);border-radius:var(--r-control);padding:12px 14px;font-family:var(--font-serif);font-size:15px;line-height:1.5;max-height:38vh;overflow:auto;}
  .histbtnrow{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  /* #19: History-modal compare mode — pick any two versions, line-level source diff */
  .cmpbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--text-muted);}
  .cmpbar select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--bg);color:var(--text);max-width:min(46%,300px);}
  /* Compare mode is now just a scroll container: the rows, gutter and folds come from the shared
     renderer below, so this no longer restyles them. The old .diffrow rules went with it (#207). */
  .diffdoc{border:1px solid var(--border);border-radius:var(--r-control);max-height:44vh;overflow:auto;}
  .diffempty{color:var(--text-muted);padding:8px 4px;font-family:var(--font-ui);font-size:13px;}
  /* MR-036: a block carrying an open comment gets the margin bar + dot */
  .blk.has-comment{box-shadow:inset 3px 0 0 var(--noteline);background:color-mix(in srgb,var(--accent) 5%,transparent);}
  .blk.has-comment .num::after{content:" \25CF";color:var(--noteline);}
  /* MR-036: threaded comment cards (gutter when wide, docked panel when narrow) */
  .gcard .ghead,.rcard .ghead{display:flex;gap:6px;align-items:baseline;margin-bottom:2px;flex-wrap:wrap;}
  /* #287: Resolve — the mock's md-viewer.html:54 action, hover -> --success. Always first of the
     .ghead actions when present (every open, can_comment-gated card gets one), so it alone carries
     margin-left:auto; Delete (conditional) simply follows it in DOM order and rides along. */
  .gcard .ghead .gres{margin-left:auto;align-self:baseline;background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;color:var(--text-muted);padding:1px 5px;border-radius:var(--r-control);}
  .gcard .ghead .gres:hover{color:var(--success);background:color-mix(in srgb,var(--success) 10%,transparent);}
  /* MR-050: secondary, muted Delete affordance — only on the reviewer's own un-engaged comment */
  .gcard .ghead .gdel{align-self:baseline;background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;color:var(--text-muted);padding:1px 5px;border-radius:var(--r-control);}
  .gcard .ghead .gdel:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);}
  .gcard .ghead .gdel.armed{color:var(--bg);background:var(--danger);font-weight:600;}
  /* #286: optimistic "posting a comment" card (AC9) — opacity .6 while in flight, full opacity
     with a danger edge once failed, matching the mock's two-state card. */
  .gcard.pending{opacity:.6;}
  .gcard.pending.failed{opacity:1;border-color:var(--danger);}
  .gpending-status{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);}
  .gpending-err{margin-top:8px;font-size:13px;color:var(--danger);}
  .gpending-actions{display:flex;gap:16px;margin-top:8px;font-family:var(--font-mono);font-size:11px;}
  .gpending-actions .glink{background:none;border:none;padding:0;cursor:pointer;font:inherit;color:var(--accent);}
  .gpending-actions .glink.muted{color:var(--text-subtle);}
  /* rev 3 thread entries: initials chip + label + relative time, hairline-separated (#279 AC6/7) */
  .gthread{display:flex;flex-direction:column;gap:8px;}
  .gentry+.gentry{border-top:1px solid var(--border-faint);padding-top:8px;}
  /* #387: thread fold. Root entry, one control for the hidden middle, then the newest entries.
     The button sits between two .gentry siblings, so it and the entry after it carry the hairline
     the .gentry+.gentry rule above would otherwise draw. */
  .gfold{align-self:flex-start;background:none;border:none;border-top:1px solid var(--border-faint);width:100%;text-align:left;padding:8px 0 0;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--accent);}
  .gfold:hover{text-decoration:underline;}
  .gfold+.gentry{border-top:1px solid var(--border-faint);padding-top:8px;}
  /* #387: per-entry clamp. max-height is set inline by applyClamps() from the computed line
     height. --gclamp-bg is the fade's end colour and must match the card ground: .gcard sits on
     --surface, .rcard on the Resolved panel's --surface-raised. */
  .gentry.clamped .gtext{overflow:hidden;position:relative;}
  .gentry.clamped .gtext::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.4em;background:linear-gradient(to bottom,transparent,var(--gclamp-bg,var(--surface)));pointer-events:none;}
  .rcard{--gclamp-bg:var(--surface-raised);}
  .gmore{display:block;background:none;border:none;padding:4px 0 0;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--accent);}
  .gmore:hover{text-decoration:underline;}
  .gentry .gmeta{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .gentry .gav{width:22px;height:22px;flex:0 0 auto;border-radius:6px;background:var(--code-bg);color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:600;}
  .gentry.you .gav{background:var(--accent-muted);color:var(--accent);}
  .gentry .gwho{font-size:12px;font-weight:600;color:var(--text);}
  .gentry.agent .gwho{color:var(--text-muted);}
  /* #331: ADDRESSED badge — set via threadHtml()'s `addressed` arg (isAddressed(), a real JS
     derivation), never a static class on the card. Sits after .gwho, before the (margin-left:auto)
     timestamp, matching scraps/03-viewer.html. */
  .gentry .gaddr{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--success);}
  .gentry .gts{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);white-space:nowrap;}
  .gentry .gtext{color:var(--text);}
  .gentry .gtext>:first-child{margin-top:0;}
  .gentry .gtext>:last-child{margin-bottom:0;}
  .gentry .gtext p{margin:.4em 0;}
  .gentry .gtext ul,.gentry .gtext ol{margin:.4em 0;padding-left:1.3em;}
  .gentry .gtext li{margin:.15em 0;}
  .gentry .gtext code{font-family:var(--font-mono);font-size:.9em;background:var(--code-bg);padding:.5px 4px;border-radius:var(--r-control);}
  .gentry .gtext pre{background:var(--code-bg);padding:7px 9px;border-radius:var(--r-control);overflow:auto;margin:.4em 0;}
  .gentry .gtext pre code{background:none;padding:0;font-size:.86em;}
  .gentry .gtext a{color:var(--accent);}
  .gentry .gtext blockquote{margin:.4em 0;padding-left:8px;border-left:2px solid var(--border);color:var(--text-muted);}
  .gentry .gtext h1,.gentry .gtext h2,.gentry .gtext h3,.gentry .gtext h4,.gentry .gtext h5{font-size:13px;margin:.5em 0 .2em;}
  .gentry .gtext img{max-width:100%;border-radius:var(--r-control);}
  .gentry .gtext hr{border:none;border-top:1px solid var(--border);margin:.5em 0;}
  /* #320: view-only readers keep every READ surface (threads, resolved, history) and lose only the
     author surfaces. One class, so a repaint cannot resurrect a box the policy refuses. */
  #viewonly{display:none;font-size:var(--t-meta);color:var(--text-muted);letter-spacing:.01em;}
  body.viewonly #viewonly{display:inline;}
  body.viewonly .greply,body.viewonly .reopenbox,body.viewonly #addbtn,body.viewonly #pop,body.viewonly .gres{display:none !important;}
  /* .gres carries the .ghead row's only margin-left:auto (see :194); body.viewonly hiding it
     takes that auto margin out of the flex flow too, which would otherwise leave a viewonly
     .gdel (deletable=true, no agent reply yet — exactly the reader's own un-engaged comment)
     packed left instead of flush right. Two auto margins would split the free space and park
     .gres mid-row, so this is additive to :194, not a duplicate of it. */
  body.viewonly .gcard .ghead .gdel{margin-left:auto;}
  .greply,.reopenbox{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
  .greply textarea,.reopenbox textarea{width:100%;min-height:36px;font-family:var(--font-ui);font-size:12.5px;border:1px solid var(--border);border-radius:var(--r-control);padding:6px;background:var(--bg);color:var(--text);resize:vertical;}
  .greply .btn,.reopenbox .btn{align-self:flex-end;padding:4px 12px;font-size:12px;}
  /* Resolved history panel */
  #resolved{display:none;position:fixed;right:18px;bottom:70px;z-index:55;width:380px;max-height:64vh;overflow:auto;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-menu);padding:14px;font-family:var(--font-ui);}
  #resolved h3{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);}

  #resempty{color:var(--text-muted);font-size:13px;}
  .rcard{border-top:1px solid var(--border-faint);padding:11px 0;font-size:13px;}
  .rcard .gref{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);font-weight:600;}
  /* narrow fallback: the active-comment gutter docks bottom-right with static cards */
  #gutter.docked{position:fixed;right:18px;bottom:70px;top:auto!important;left:auto!important;width:360px;max-height:64vh;overflow:auto;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-menu);padding:12px;display:block;z-index:55;}
  #gutter.docked .gcard{position:static;width:auto;margin-bottom:8px;box-shadow:none;}

  /* ---- Share control (#133 public link, extended by #134 people) ---- */
  .tb-btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--text);background:none;
    border:1px solid var(--border);border-radius:var(--r-control);padding:5px 12px;cursor:pointer;
    text-transform:none;letter-spacing:normal;}

  /* #181 (§08 rule 01) — the button states what is true: brand-tinted once a public link OR a
     named grantee exists. Declared AFTER :hover on purpose — both are (0,2,0), so source order
     is what stops the brand border reverting to grey under the pointer. */
  .tb-btn.shared,.tb-btn.shared:hover{color:var(--accent);background:var(--accent-muted);border-color:var(--accent);}
  .tb-btn .ct{font-weight:500;opacity:.75;}
  .share-wrap{position:relative;display:flex;}
  .sharepop{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r-panel);box-shadow:var(--shadow-menu);
    padding:16px;z-index:60;text-transform:none;letter-spacing:normal;text-align:left;}
  .sharepop h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--text);}
  .share-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .share-lbl{font-size:13px;color:var(--text);}
  .share-lbl small{display:block;color:var(--text-muted);font-size:11.5px;margin-top:2px;font-weight:400;}
  .switch{position:relative;width:40px;height:22px;flex:0 0 auto;display:inline-block;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .track{position:absolute;inset:0;background:var(--border);border-radius:var(--r-pill);transition:.15s;
    cursor:pointer;display:block;}
  .switch .track:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
    background:var(--paper);border-radius:var(--r-pill);transition:.15s;}

  .share-link{display:flex;gap:8px;margin-top:14px;}
  .share-link input{flex:1;min-width:0;font:inherit;font-size:12px;padding:8px 10px;
    border:1px solid var(--border);border-radius:var(--r-control);background:var(--bg);color:var(--text-muted);}

    border-radius:var(--r-control);background:var(--accent);color:var(--bg);cursor:pointer;white-space:nowrap;}
  .share-copy:hover{opacity:.92;}

     border:none, and adding one here would shift the row by 2px on every confirm. */
  .share-copy.ok,.share-copy.ok:hover{background:var(--success-bg);color:var(--success);opacity:1;
    box-shadow:inset 0 0 0 1px var(--success-border);}
  /* #134 named-share / people section */
  .share-sep{height:1px;background:var(--border);margin:16px 0;}
  .share-people h4{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--text-muted);}
  .share-list{display:flex;flex-direction:column;gap:8px;margin:0 0 12px;}
  .share-item{display:flex;align-items:center;gap:8px;font-size:13px;}
  .share-item .em{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .share-item .rt{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:capitalize;}
  .share-item .rm{background:none;border:none;color:var(--text-subtle,var(--text-muted));cursor:pointer;
    font-size:16px;line-height:1;padding:1px 5px;border-radius:var(--r-control);}
  .share-item .rm:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);}
  .share-empty{color:var(--text-muted);font-size:12.5px;margin:0 0 12px;}
  .share-invite{display:flex;gap:6px;align-items:center;}
  .share-invite input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:8px 10px;
    border:1px solid var(--border);border-radius:var(--r-control);background:var(--bg);color:var(--text);}
  .share-invite select{font:inherit;font-size:12.5px;padding:8px 6px;border:1px solid var(--border);
    border-radius:var(--r-control);background:var(--bg);color:var(--text);}
  .share-invite button{font:inherit;font-size:12.5px;font-weight:600;padding:8px 12px;border:none;
    border-radius:var(--r-control);background:var(--accent);color:var(--bg);cursor:pointer;white-space:nowrap;}
  .share-err{color:var(--danger);font-size:12px;margin:8px 0 0;}

  /* ---- #207 diff toggle + hunked unified diff ------------------------------------------------
     Colours are the EXISTING --success/--danger status pairs, not new tokens: an add is "good" and a
     removal is "danger" in exactly the sense theme.css already means. The sign column carries the
     add/remove distinction independently of colour, so the diff survives greyscale and a
     colourblind reader. */
  /* Row/gutter/fold styling and the .difftoggle shape moved to theme.css in #208, so the latex
     viewer renders the identical markup from the identical rules. Only the pane wrapper, which is
     this page's own layout, stays here. */
  #diffpane{font-family:var(--font-mono);font-size:13px;line-height:1.6;
    border:1px solid var(--border);border-radius:var(--r-card,12px);overflow:hidden;margin:8px 0 40px;}

  /* ---- #290 in-place editor (epic #273 slice B) ------------------------------------------------
     Mutually exclusive with #diffpane / #article (only one pane is ever unhidden at a time — see
     the JS-side rule next to openEditor()). Edit is a plain raw-source textarea on purpose: no
     contenteditable, no HTML-to-markdown conversion, ever. */
  #editpane{margin:8px 0 40px;}
  #editbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--font-ui);}
  .editspacer{flex:1;}
  #editnotice{flex:1 1 auto;font-size:12.5px;line-height:1.5;color:var(--warning);background:var(--warning-bg);
    border:1px solid var(--warning-border);border-radius:var(--r-control);padding:7px 11px;}
  #editnotice .btn{font-size:11.5px;padding:3px 10px;margin-left:6px;}
  #edittext{width:100%;min-height:60vh;font-family:var(--font-mono);
    font-size:14px;line-height:1.6;border:1px solid var(--border);border-radius:var(--r-card,12px);
    padding:16px;background:var(--surface);color:var(--text);resize:vertical;}
  #edittext:focus{outline:none;border-color:var(--accent);}
  /* the diff toggle is disabled (not hidden) while editing, so its presence in the bar is stable —
     only its affordance changes, per the stated edit/diff mutual-exclusion rule. */
  .tb-btn:disabled{opacity:.4;cursor:not-allowed;}
  /* theme.css's shared `.difftoggle{display:inline-flex}` (an AUTHOR rule) defeats the UA's
     [hidden]{display:none}, so before any agent push the pill rendered despite refreshDiffAvail()
     setting hidden. Re-assert the gate at author level (#279 AC18; pre-existing on dev). */
  #difftoggle[hidden]{display:none;}
</style>

<body>

<script>
const $=s=>document.querySelector(s);
let META={name:"file.md",path:""};
let docTitle="";
let comments=[];        // the shared server-side comment threads (GET /comments)
let cur=null;           // pending anchor while authoring a comment
let lastSrc=0;          // source_updated (doc live-reload)
let lastCmt=0;          // comments_updated (thread live-reload)
let confirming=null;    // comment_id with a pending inline delete-confirm (guards the poll re-render)
let WORDS=0;            // prose word count, cached by load() for the title meta line
let LASTTURN=null,LASTSTATUS=null;  // last turn/status painted, so the poll repaints only on change
// #286: the optimistic "posting a comment" card. Set by createComment() before the POST resolves;
// null once it settles (2xx) or the human discards a failed one. Non-null blocks the live poll's
// full renderAll() (same reason `confirming` already does for an armed delete), and renderAll()
// itself paints the extra card whenever this is set.
let pendingPost=null;
// #286: shared arc spinner (theme.css's .spin keyframe + reduced-motion guard), 12px per the
// mock's "posting…" card.
const SPIN_ICON_SM='<svg class="spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';

// #320: /status.can_comment — the custody policy's can_comment, the SAME gate POST /comments
// enforces. Defaults TRUE so a server that predates the key behaves exactly as before (the owner
// and the local tier are the overwhelming case, and a stale-server false would silently remove
// the owner's own composer). A refused post corrects it, so a revoked grant self-heals.
let CAN_COMMENT=true;

// ---- #290 in-place editor state (epic #273 slice B) -------------------------------------------
let CAN_EDIT=false;     // /status.can_edit (#288) — the ONLY edit gate; never the /shares 200/404
                         // probe initShare() uses (that route has no arm on the local tier at all).
let EDITON=false;       // editor open (mutually exclusive with DIFFON — see openEditor())
let EDITREV=null;       // the revision this editor session read WITH the source (never a second
                         // fetch — see openEditor()); sent back as If-Match on save.
let EDITORIG="";        // the buffer's value as loaded/reloaded, to ask before discarding edits
let EDITACK=null;       // remote revision the user already dismissed the change-notice for, so
                         // the 2s poll doesn't re-nag about the same change every tick

function toast(msg){const t=$("#toast");t.classList.remove('hasaction','resolve');t.textContent=msg;t.style.opacity=1;clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.opacity=0,1800);}
// #287: the resolve-undo window, the #179 UNDO_MS shape (one constant, toast lifetime derives
// from it — a UI promising 10s cannot be served by a toast that lives 3). Reused nowhere else
// yet, so it stays a plain top-level const rather than a config knob.
const UNDO_MS=10000;
// A toast carrying one clickable action. cls (optional) adds a skin modifier class alongside
// .hasaction — 'resolve' is the mock's fixed dark chip (theme.css --resolve-chip-*); omit it for
// an ordinary accent-skinned action toast. ms (optional) is the lifetime; defaults to the plain
// toast's 1800ms, but resolveComment() below always passes UNDO_MS explicitly.
function toastAction(msg,label,fn,cls,ms){
  const t=$("#toast");
  t.classList.add('hasaction');if(cls)t.classList.add(cls);
  t.innerHTML='<span></span><button type="button" class="toastbtn"></button>';
  t.querySelector('span').textContent=msg;
  const b=t.querySelector('.toastbtn');b.textContent=label;
  const clear=()=>{t.style.opacity=0;t.classList.remove('hasaction');if(cls)t.classList.remove(cls);};
  b.onclick=()=>{clear();fn();};
  t.style.opacity=1;clearTimeout(window._tt);window._tt=setTimeout(clear,ms||1800);
}
// String() first: anchor.block_num arrives as a NUMBER from API/MCP authors (the viewer itself
// sends strings), and Number.replace is a TypeError that used to kill renderAll() mid-pass,
// leaving the counters stale and the resolved panel empty.
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function fileBase(p){return (p||"").split('/').pop()||p;}
// Relative time, the dashboard's ago() bucketing verbatim (#279 AC7) — keep the two in step.
function ago(ts){
  if(!ts)return "";
  const s=Date.now()/1000-ts;
  if(s<60)return "just now";
  const m=s/60; if(m<60)return Math.round(m)+"m ago";
  const h=m/60; if(h<24)return Math.round(h)+"h ago";
  const d=h/24; if(d<30)return Math.round(d)+"d ago";
  return new Date(ts*1000).toLocaleDateString();
}
// chrome derived from META (rev 3): mono top-bar breadcrumb "project / source_path", present
// segments only; legacy reviews without provenance fall back to the filename/title (back-compat).
function renderChrome(){
  const segs=[META.project,META.source_path].filter(Boolean);
  $("#filename").textContent=segs.length?segs.join(' / '):(fileBase(META.source_path)||META.title||('review '+ID));
}
// eyebrow above the title: project · vN · pushed <ago> (present segments only)
function renderEyebrow(st){
  const bc=$("#breadcrumb");if(!bc)return;
  const rev=(st&&st.revision)||META.revision||0;
  bc.textContent=[META.project,rev?('v'+rev):'', st&&st.source_updated?('pushed '+ago(st.source_updated)):'']
    .filter(Boolean).join(' · ');
}
// title meta line (rev 3): turn dot + "N open comments" + words/min. "Your turn" renders ONLY when
// /status.turn is reviewer and the review is not resolved — the dashboard's derivation (#279 AC20).
// Client-side only; #opencmt is re-written by every renderAll() pass from the same comments array.
function renderDocMeta(st){
  const dm=$("#docmeta");if(dm===null)return;
  st=st||{};LASTTURN=st.turn;LASTSTATUS=st.status;
  const open=(comments||[]).filter(c=>c.status!=='resolved').length;
  const yourTurn=(st.turn||'reviewer')==='reviewer'&&st.status!=='resolved';
  dm.innerHTML=(yourTurn?'<span class="turn"><i class="tdot" aria-hidden="true"></i>Your turn</span><span class="msep">·</span>':'')
    +'<span id="opencmt">'+open+' open comment'+(open===1?'':'s')+'</span><span class="msep">·</span>'
    +'<span class="mwords">'+WORDS.toLocaleString()+' words · '+Math.max(1,Math.round(WORDS/200))+' min</span>';
}

// ---- who is reading (#279 AC6) + universal attribution (#309) ----------------------------------
// The hosted plane has /auth/session ({uid,email,...}); the local tier has NO such route (404) and
// is single-user by construction. isOwnEntry answers "is this MINE" for the .you highlight and the
// "unnamed" fallback below — a reviewer entry is "yours" only when its author IS the signed-in
// uid, so on a shared review another grantee's words are never highlighted or defaulted as yours.
//
// #309 UNIVERSAL attribution (owner decision, corrected from an earlier ego-centric draft): the
// comments API resolves each thread entry's CURRENT display name server-side
// (CommentService.with_author_names, read fresh from the user record on every GET, never
// snapshotted onto the comment) and hands it to EVERY reader as e.name — not only the author
// viewing their own words. entryLabel/initialsOf read that field directly, for anyone's entry.
// SESSION is consulted only for the "no name set yet" fallback (own entry -> "You", anyone else's
// -> "Reviewer"), which is exactly today's pre-#309 behaviour, unperturbed.
let SESSION={tier:'unknown',uid:null,email:''};
async function initSession(){
  try{
    const r=await fetch('/auth/session',{cache:'no-store'});
    if(r.status===404){SESSION={tier:'local',uid:null,email:''};return;}
    if(r.ok){const d=await r.json().catch(()=>({}));SESSION={tier:'hosted',uid:d.uid||null,email:d.email||''};return;}
    SESSION={tier:'hosted',uid:null,email:''};
  }catch(e){SESSION={tier:'hosted',uid:null,email:''};}
}
// True for an entry that is YOURS to highlight/default specially — never for an agent entry (that
// always reads "Agent" regardless of who is looking), so callers that only check role need no
// extra guard.
function isOwnEntry(e){
  return e.role!=='agent' && (SESSION.tier==='local' || (SESSION.uid&&e.author===SESSION.uid));
}
function entryLabel(e){
  if(e.role==='agent')return 'Agent';
  if(e.name)return e.name;                 // #309: the author's CURRENT name, visible to ANY reader
  return isOwnEntry(e)?'You':'Reviewer';   // unset: today's behaviour, unperturbed
}
function initialsOf(e){
  if(e.role==='agent')return 'ag';
  if(e.name){
    // First letters of the first two whitespace-split words ("Ada Lovelace" -> "al"), else the
    // name's own first two characters (a single-word name) — same shape as account.js's nameInitials.
    const parts=e.name.trim().split(/\s+/).filter(Boolean);
    if(parts.length>=2)return (parts[0][0]+parts[1][0]).toLowerCase();
    if(parts.length)return parts[0].slice(0,2).toLowerCase();
  }
  if(!isOwnEntry(e))return 'rv';
  // own, unnamed: the pre-#309 email heuristic (first letters of the first two separator-split
  // local-part segments).
  const parts=(SESSION.email||'').split('@')[0].split(/[._-]+/).filter(Boolean);
  if(parts.length>=2)return (parts[0][0]+parts[1][0]).toLowerCase();
  if(parts.length)return parts[0].slice(0,2).toLowerCase();
  return 'me';
}


function initMermaid(){
  if(!window.mermaid)return;
  // #285: the EFFECTIVE theme, never the OS alone — an explicit data-theme override wins; only
  // with the attribute absent (auto) does the OS decide. Same resolution as
  // window.mdTheme.effective(), inlined because account.js loads after boot() runs.
  const t=document.documentElement.getAttribute('data-theme');
  const dark=t?t==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  try{mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:dark?'dark':'default'});}catch(e){}
}
async function renderMermaid(){
  const codes=[...document.querySelectorAll('#article code.language-mermaid')];
  codes.forEach(c=>{
    const div=document.createElement('div');
    div.className='mermaid';div.textContent=c.textContent;
    div.dataset.src=c.textContent;   // #285: mermaid.run consumes the text; keep it for retheme
    (c.closest('pre')||c).replaceWith(div);
  });
  if(window.mermaid&&codes.length){
    try{await mermaid.run({querySelector:'#article .mermaid'});}catch(e){console.warn('mermaid render failed',e);}
  }
}
// #285: mermaid bakes its theme into the SVG at render time, so following an effective-theme
// change (a toggle click, or an OS flip while in auto) means rendering again from the kept
// source. Driven by the mdr:themechange signal, NOT a matchMedia listener: the OS disagrees with
// an explicit override.
async function rethemeMermaid(){
  const divs=[...document.querySelectorAll('#article .mermaid')];
  if(!window.mermaid||!divs.length)return;
  initMermaid();   // re-reads the effective theme
  divs.forEach(d=>{d.removeAttribute('data-processed');d.textContent=d.dataset.src||d.textContent;});
  try{await mermaid.run({querySelector:'#article .mermaid'});}catch(e){console.warn('mermaid retheme failed',e);}
}
document.addEventListener('mdr:themechange',rethemeMermaid);
// Math rendering: a marked extension tokenizes math DURING the markdown parse and renders it
// to HTML with KaTeX. It must run inside marked, not as a post-pass: marked strips the
// backslashes from \(...\) / \[...\] (turning them into literal parens/brackets) and can mangle
// $...$ internals, and KaTeX's auto-render bare-$ scan pairs prose dollars (rendering "$5 and
// $10" as math). The tokenizers below match Jekyll/MathJax delimiters — inline $...$ and \(...\),
// display $$...$$ and \[...\] — with a no-whitespace-hugging rule on $...$ so prose/currency/lone
// $ stays literal; code spans and fenced blocks are skipped by marked's own tokenizer.
function katexHTML(tex, display){
  try{ return katex.renderToString(tex, {displayMode:display, throwOnError:false}); }
  catch(e){ return (display?'$$':'$')+escapeHtml(tex)+(display?'$$':'$'); }
}
// Register marked extensions once, before any marked.parse(). Each feature is guarded on its own
// global, so a missing vendored asset degrades to today's behavior instead of throwing (default-safe).
let _markedReady=false;
function setupMarked(){
  if(_markedReady||!window.marked)return;
  _markedReady=true;
  // Math (KaTeX): inline $…$ / \(…\), display $$…$$ / \[…\].
  if(window.katex) marked.use({extensions:[
    { name:'blockMath', level:'block',
      start(src){ const m=src.match(/\$\$|\\\[/); return m?m.index:undefined; },
      tokenizer(src){
        let m=/^\$\$([\s\S]+?)\$\$/.exec(src);
        if(m) return {type:'blockMath', raw:m[0], text:m[1].trim(), display:true};
        m=/^\\\[([\s\S]+?)\\\]/.exec(src);
        if(m) return {type:'blockMath', raw:m[0], text:m[1].trim(), display:true};
      },
      renderer(t){ return katexHTML(t.text, true); } },
    { name:'inlineMath', level:'inline',
      start(src){ const m=src.match(/\$[^\s$]|\\\(/); return m?m.index:undefined; },
      tokenizer(src){
        let m=/^\\\(([\s\S]+?)\\\)/.exec(src);
        if(m) return {type:'inlineMath', raw:m[0], text:m[1].trim(), display:false};
        m=/^\$([^\s$](?:[^$\n]*[^\s$])?)\$/.exec(src);
        if(m) return {type:'inlineMath', raw:m[0], text:m[1], display:false};
      },
      renderer(t){ return katexHTML(t.text, false); } },
  ]});
  // GFM footnotes: window.markedFootnote IS the factory; refs -> ordered back-ref section.
  var mf=window.markedFootnote;
  if(typeof mf==='function') marked.use(mf());
  // Syntax highlighting (highlight.js): window.markedHighlight is a NAMESPACE object whose
  // .markedHighlight is the factory (a bare markedHighlight() throws). The guard wraps the actual
  // call, so a missing asset degrades silently. The sync highlight callback keeps marked.parse
  // synchronous; mermaid blocks are returned raw so renderMermaid() still makes them diagrams.
  var mh=window.markedHighlight && window.markedHighlight.markedHighlight;
  if(mh && window.hljs) marked.use(mh({
    langPrefix:'hljs language-',
    highlight(code, lang){
      if(lang==='mermaid') return code;
      if(lang && hljs.getLanguage(lang)) return hljs.highlight(code, {language:lang}).value;
      return hljs.highlightAuto(code).value;
    }
  }));
}

const ID=location.pathname.split('/').filter(Boolean).pop();
const API='/api/reviews/'+ID;

// Point <img> sources at attached assets the service now hosts. The agent attached the draft's
// images to the review, so a site-root (/assets/x.png) or source-relative (../img/y.svg) src is
// matched to an attached asset — by full draft src first, then basename — and repointed at the
// served stored-name URL (%2F-free). Absolute http(s)/protocol-relative/data: srcs and unmatched
// local srcs are left untouched (no regression, no source.md mutation).
async function rewriteAssetImages(root){
  const imgs=[...root.querySelectorAll('img')];
  if(!imgs.length)return;
  let assets=[];
  try{ assets=((await fetch(API+'/assets').then(r=>r.json()))||{}).assets||[]; }catch(e){ return; }
  if(!assets.length)return;
  const base=s=>s.split(/[?#]/)[0].split('/').pop();
  const byName=new Map(), byBase=new Map();
  for(const a of assets){ byName.set(a.name,a); const b=base(a.name); if(!byBase.has(b))byBase.set(b,a); }
  for(const img of imgs){
    const src=img.getAttribute('src')||'';
    if(!src||/^(https?:|data:|\/\/)/i.test(src))continue;
    const m=byName.get(src)||byBase.get(base(src));
    if(m&&m.url)img.src=m.url;
  }
}

async function boot(){
  setupMarked();  // register marked extensions (math, footnotes, …) once, before any marked.parse()
  initMermaid();
  await initSession();     // resolve who is reading BEFORE the first card render (labels, #279 AC6)
  META=await fetch(API).then(r=>r.json()).catch(()=>({}));
  document.title="mdreview · "+(META.title||ID);
  renderChrome();
  await fetchComments();   // the shared server-side comments are the single feedback surface
  await load();
  await refreshDiffAvail();  // reveals the diff toggle if there is an earlier version; never opens it
  poll();
}

async function load(){
  let md=await fetch(API+'/source',{cache:'no-store'}).then(r=>r.text());
  const st=await fetch(API+'/status').then(r=>r.json()).catch(()=>({}));
  lastSrc=st.source_updated||0;lastCmt=st.comments_updated||0;
  setEditVisible(!!st.can_edit);   // #290 edit gate — can_edit ONLY, never the /shares probe
  setCommentVisible(st.can_comment!==false);   // #320 comment gate; absent key -> unchanged
  // extract YAML front matter (for the title) and strip it
  let title="";
  const fm=md.match(/^﻿?\s*---\r?\n([\s\S]*?)\r?\n---\s*/);
  if(fm){
    const tm=fm[1].match(/^\s*title:\s*["']?(.+?)["']?\s*$/m);
    if(tm)title=tm[1];
    md=md.slice(fm[0].length);
  }
  // strip a leading HTML comment (working-draft metadata)
  md=md.replace(/^\s*<!--[\s\S]*?-->\s*/,'');
  docTitle=title||META.title||ID;
  const dt=$("#doctitle");if(dt)dt.textContent=title;
  // word count + reading time, from prose (drop fenced code/diagram blocks)
  const prose=md.replace(/```[\s\S]*?```/g,' ');
  WORDS=(prose.trim().match(/\S+/g)||[]).length;
  renderEyebrow(st);       // project · vN · pushed <ago>
  renderDocMeta(st);       // turn dot · open count · words/min (open count re-written by renderAll)
  const html=window.marked?marked.parse(md):("<pre>"+escapeHtml(md)+"</pre>");
  const art=$("#article");art.innerHTML=html;
  await rewriteAssetImages(art);   // repoint local <img> at served assets before reparenting
  numberBlocks();
  await renderMermaid();
  renderAll();
}

// content-derived stable block id (issue #15): FNV-1a over whitespace-normalized text -> hex, so a
// whole-block comment re-anchors by CONTENT after a live-reload renumber (positional #N is unstable
// when a block is inserted/removed above it). Hex-only charset keeps `.blk[data-bid="…"]` selector-safe.
function blockHash(s){s=(s||'').replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return(h>>>0).toString(16);}
function numberBlocks(){
  const art=$("#article");
  const kids=[...art.children];
  art.innerHTML="";
  let n=0,heading="";const seen={};
  kids.forEach(el=>{
    if(/^H[1-3]$/.test(el.tagName))heading=el.textContent.trim();
    n++;
    // hash el (the child), NOT blk: blk holds the .num span (text = n), which would fold the block
    // NUMBER into the hash and break it on every renumber. Computed here in numberBlocks (called
    // BEFORE renderMermaid) so a diagram/code block hashes its stable SOURCE, and the .blk keeps its
    // data-bid after mermaid swaps its innards to SVG (do NOT move this to renderAll). A per-render
    // occurrence suffix disambiguates verbatim-identical blocks (else querySelector grabs the first).
    let bid=blockHash(el.textContent);const k=seen[bid]=(seen[bid]||0)+1;if(k>1)bid+='-'+k;
    const blk=document.createElement('div');
    blk.className="blk";blk.dataset.num=n;blk.dataset.heading=heading;blk.dataset.bid=bid;
    const num=document.createElement('span');num.className="num";num.title="comment on this block";num.textContent=n;
    blk.appendChild(num);blk.appendChild(el);
    art.appendChild(blk);
    // block_num:blk.dataset.num (per-iteration const), NOT String(n): n is function-scoped, so the old
    // closure read the FINAL n (=total block count) for every gutter click. bid carries the stable id.
    num.onclick=()=>openPop({block_num:blk.dataset.num,quoted_text:'',bid:blk.dataset.bid});
  });
}

// --- comment actions: every human-author path writes the shared comment store ---
async function fetchComments(){
  try{const d=await fetch(API+'/comments',{cache:'no-store'}).then(r=>r.json());comments=(d&&d.comments)||[];}
  catch(e){}
}
// A write on a shared/public review that the caller isn't signed in for gets 401 (view-only public
// links are anonymous-comment-free by design). fetch() only rejects on NETWORK errors, so without an
// r.ok check a 401 slid straight through to a false "added" toast; instead prompt the visitor to sign
// in (the top-bar "Sign in" links to the sign-in screen). Returns false so the caller keeps its input.
function commentDenied(r,fallback){
  if(r.status===401){toast('Sign in to comment');return true;}
  // #320: a 404 on a comment POST for a document we are READING is not a missing document — it is
  // the custody policy refusing the note (view-only share, or a public link with no named grant).
  // Naming that beats "Could not save comment", which reads as a server fault the reader could
  // retry away. Also re-gates the surfaces, so a grant revoked mid-session settles immediately.
  if(r.status===404){setCommentVisible(false);toast('You have view-only access to this document');return true;}
  if(!r.ok){toast(fallback);return true;}
  return false;
}
// #286: optimistic post. Renders the pending card (via renderAll(), below) immediately, then
// resolves it: 2xx clears pendingPost and the normal fetch+repaint takes over (the pending card is
// gone, replaced by the real one); a network error or non-2xx leaves pendingPost.failed=true so
// renderAll() keeps showing the SAME card with "Not posted — your text is kept." + retry (calls
// this again with the identical anchor/text) / discard (clears pendingPost and repaints).
async function createComment(anchor,text){
  pendingPost={anchor:anchor,text:text,failed:false};
  renderAll();
  return submitPendingPost();
}
async function submitPendingPost(){
  if(!pendingPost)return true;   // discarded before this call started
  pendingPost.failed=false;
  let r;
  try{
    r=await fetch(API+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({anchor:pendingPost.anchor,text:pendingPost.text})});
  }catch(e){ pendingPost.failed=true; renderAll(); return false; }
  if(commentDenied(r,'Could not save comment')){ pendingPost.failed=true; renderAll(); return false; }
  pendingPost=null;
  await fetchComments();renderAll();toast('Comment added');return true;
}
function discardPending(){ pendingPost=null; renderAll(); }
function pendingCardHtml(p){
  if(!p.failed)
    return '<div class="gcard pending"><span class="gq"></span><div class="gtext">'+esc(p.text)+'</div>'+
      '<div class="gpending-status">'+SPIN_ICON_SM+'posting…</div></div>';
  return '<div class="gcard pending failed"><span class="gq"></span><div class="gtext">'+esc(p.text)+'</div>'+
    '<div class="gpending-err">Not posted — your text is kept.</div>'+
    '<div class="gpending-actions"><button type="button" class="glink" data-act="retry">retry</button>'+
    '<button type="button" class="glink muted" data-act="discard">discard</button></div></div>';
}
function wirePendingCard(el){
  const retry=el.querySelector('[data-act=retry]');if(retry)retry.onclick=e=>{e.stopPropagation();submitPendingPost();};
  const discard=el.querySelector('[data-act=discard]');if(discard)discard.onclick=e=>{e.stopPropagation();discardPending();};
}
async function replyTo(cid,text){
  if(!text)return false;
  try{
    const r=await fetch(API+'/comments/'+cid+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text,role:'reviewer'})});
    if(commentDenied(r,'Reply failed'))return false;
    await fetchComments();renderAll();return true;
  }catch(e){toast('Reply failed');return false;}
}
async function reopenComment(cid,text){
  try{
    const r=await fetch(API+'/comments/'+cid+'/reopen',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(text?{text:text}:{})});
    // #287: reopen can race another tab/agent that got there first. 409 means the end state IS
    // what the caller wanted (already reopened) — that is a fact to report, not the 'Reopen
    // failed' error tone. commentDenied's 404 stays as-is for this route (it also fires when the
    // comment itself was deleted meanwhile, a case this file does not try to distinguish from
    // lost custody by inspecting the error body — out of scope here).
    if(r.status===409){await fetchComments();renderAll();toast('Already reopened');return true;}
    if(commentDenied(r,'Reopen failed'))return false;
    await fetchComments();renderAll();toast('Reopened');return true;
  }catch(e){toast('Reopen failed');return false;}
}
async function resolveComment(cid){
  try{
    // X-Mdreview-Client: viewer (editguard.js's existing convention, #289) is what lets the
    // server tell a human's click apart from an agent's MCP call on the local/single-operator
    // tier, where both share plane="local" with no other signal (#287 D2).
    const r=await fetch(API+'/comments/'+cid+'/resolve',{method:'POST',
      headers:{'Content-Type':'application/json','X-Mdreview-Client':'viewer'},body:'{}'});
    if(commentDenied(r,'Could not resolve'))return false;
    await fetchComments();renderAll();
    // Commit-then-inverse (#179 shape): the resolve is already committed (200 received) before
    // this toast shows. Undo is just the existing reopen call, offered back for UNDO_MS.
    toastAction('Comment resolved','undo',()=>{reopenComment(cid,'');},'resolve',UNDO_MS);
    return true;
  }catch(e){toast('Could not resolve');return false;}
}
async function deleteComment(cid){
  // Hard-remove a comment the reviewer made by mistake (DELETE /comments/{cid}). A 404 means it's
  // already gone (e.g. an agent deleted it concurrently) — treat as success and let the re-render
  // drop the card. Only a real failure (5xx/network) keeps the card, with an error toast.
  try{
    const r=await fetch(API+'/comments/'+cid,{method:'DELETE'});
    if(!r.ok&&r.status!==404){toast('Could not delete');return;}
    await fetchComments();renderAll();toast('Comment deleted');
  }catch(e){toast('Could not delete');}
}

// --- rendering: active threads in the gutter, resolved ones in the Resolved panel ---
const esc=escapeHtml;
// Render a comment body as markdown (bold/italic/code/lists/links/line-breaks). Comments are
// UNTRUSTED, no-auth input, so HTML is escaped FIRST (neutralises raw-HTML / attribute injection),
// THEN marked renders the markdown syntax; a final pass drops any javascript:/data: URL an author
// slipped into a link or image. `breaks:true` makes a single newline a line break (chat-like).
function mdComment(raw){
  raw=raw||'';
  const html=window.marked?marked.parse(esc(raw),{breaks:true}):esc(raw).replace(/\n/g,'<br>');
  const tpl=document.createElement('template');tpl.innerHTML=html;   // <template> content is inert (no img loads)
  tpl.content.querySelectorAll('a[href]').forEach(a=>{
    if(/^(https?:|mailto:)/i.test(a.getAttribute('href')||'')){a.target='_blank';a.rel='noopener noreferrer';}
    else a.removeAttribute('href');
  });
  tpl.content.querySelectorAll('img[src]').forEach(im=>{
    if(!/^(https?:|data:image\/)/i.test(im.getAttribute('src')||''))im.removeAttribute('src');
  });
  return tpl.innerHTML;
}
function qsnippet(c){const q=(c.anchor&&c.anchor.quoted_text)||'';return q?'"'+q+'"':'(whole block)';}
// #331: ADDRESSED = an OPEN thread (not resolved -> not .rcard) whose most recent entry is
// authored by the agent. Derived purely from data the viewer already has (thread + status), so
// there is no server field to drift from. A thread the human last touched, or that is resolved,
// is never addressed — resolved already has its own surface (.rcard in #resolved).
function isAddressed(c){
  const t=c.thread||[];
  return c.status!=='resolved' && t.length>0 && t[t.length-1].role==='agent';
}
// rev 3 entries: initials chip + label (your own name, or "You" while unset — see entryLabel) +
// relative time from thread[].ts (absent on legacy entries -> no time span, never "just now").
// `addressed` (isAddressed(c), always false for resolved threads) puts the ADDRESSED badge on
// the one entry that earned it: the thread's last, agent-authored entry, never any other.
// `.you` styling keys on isOwnEntry(e), NOT on the label text — #309 made the label a real name
// for your own entries, so a text comparison against the literal string "You" would silently stop
// highlighting them the moment you set one.
// #387: a long thread folds its middle. The root entry states the issue and the newest FOLD_TAIL
// entries are the working exchange; everything between goes behind one "N earlier replies"
// control. FOLD_MIN_HIDDEN stops a fold from hiding a single entry (a button that reveals one
// reply costs more than the reply), the same reasoning as MIN_GAP in static/linediff.js.
// foldOpen is keyed by comment_id and lives for the page session, so the 2s comments_updated
// re-render (renderAll) cannot snap an expanded thread shut while it is being read.
const FOLD_TAIL=2, FOLD_MIN_HIDDEN=2;
const foldOpen=new Set();
function foldHidden(entries){const h=entries.length-1-FOLD_TAIL;return h>=FOLD_MIN_HIDDEN?h:0;}
function threadHtml(c,addressed){
  const entries=c.thread||[];
  const foldable=foldHidden(entries), open=foldOpen.has(c.comment_id);
  const hidden=open?0:foldable;
  // data-idx is the entry's index in c.thread, not its position after folding, so anything keyed
  // on it (the clamp state) stays put when the fold opens.
  const entryHtml=(e,i)=>{
    const role=e.role==='agent'?'agent':'reviewer';
    const label=entryLabel(e);
    const showAddr=addressed&&role==='agent'&&i===entries.length-1;
    const clampable=i<entries.length-1;   // the newest entry is the one being acted on: never clamped
    return '<div class="gentry '+role+(isOwnEntry(e)?' you':'')+(clampable?' clampable':'')+'" data-idx="'+i+'">'
      +'<div class="gmeta"><span class="gav" aria-hidden="true">'+esc(initialsOf(e))+'</span>'
      +'<span class="gwho">'+esc(label)+'</span>'
      +(showAddr?'<span class="gaddr">Addressed</span>':'')
      +(e.ts?'<span class="gts">'+esc(ago(e.ts))+'</span>':'')+'</div>'
      +'<div class="gtext">'+mdComment(e.text||'')+'</div></div>';
  };
  // One toggle in both states (a disclosure control: it stays put and flips aria-expanded), so
  // an expanded thread can be folded again without a reload. It sits after the root entry.
  const toggle=foldable?'<button class="gfold" type="button" data-act="fold" aria-expanded="'+(open?'true':'false')+'">'
    +(open?'Hide '+foldable+' earlier replies':foldable+' earlier replies')+'</button>':'';
  const parts=[entryHtml(entries[0],0)];
  if(entries.length>1){
    parts.push(toggle);
    entries.slice(1+hidden).forEach((e,k)=>parts.push(entryHtml(e,1+hidden+k)));
  }
  return '<div class="gthread">'+(entries.length?parts.join(''):'')+'</div>';
}
// #387: per-entry clamp. Entries other than the newest are cut by rendered height, never by
// character count, so a markdown list or code block is not split mid-item, behind a "Show more"
// button. CLAMP_LINES is the visible cap; an entry that overflows it by fewer than
// CLAMP_SLACK_LINES shows in full, because a button that reveals one more line costs more than
// the line (MIN_GAP reasoning again). The decision needs layout, so applyClamps() runs from
// layoutComments() and the dock toggles once the container is display:block, and only decides
// entries not yet decided. clampOpen is keyed by comment_id:idx for the page session, so the
// live-reload re-render cannot re-clamp an entry someone has opened.
const CLAMP_LINES=8, CLAMP_SLACK_LINES=2;
const clampOpen=new Set();
function needsClamp(scrollH,lineH){return scrollH>(CLAMP_LINES+CLAMP_SLACK_LINES)*lineH;}
function applyClamps(root){
  root.querySelectorAll('.gentry.clampable').forEach(en=>{
    const text=en.querySelector('.gtext');
    if(!text||text.offsetParent===null)return;      // not laid out yet (hidden panel): decide when shown
    en.classList.remove('clampable');
    const card=en.closest('[data-id]');const key=(card?card.dataset.id:'')+':'+en.dataset.idx;
    const lh=parseFloat(getComputedStyle(text).lineHeight)||19.5;
    if(!needsClamp(text.scrollHeight,lh))return;
    // One toggle in both states (Show more / Show less); it stays put, so keyboard focus stays on it.
    const b=document.createElement('button');b.type='button';b.className='gmore';b.dataset.act='more';
    const set=on=>{
      en.classList.toggle('clamped',on);text.style.maxHeight=on?(CLAMP_LINES*lh)+'px':'';
      b.setAttribute('aria-expanded',on?'false':'true');b.textContent=on?'Show more':'Show less';
    };

// #199: ONE definition of "does the comment rail fit beside the text", consumed by both
// layoutComments() and positionPop(). They carried the identical literal before, so a fix applied
// to one shipped a viewer whose rail sat beside the text while its composer was docked. The CSS
// (.wrap clamp) is what makes this true in the ~1100-1340 band; this is the gate that reads it.
// RAIL_W + GAP must match the 284px width and 24px offset used below.
const RAIL_W=284, RAIL_GAP=36;
function railFits(rect){ return window.innerWidth >= rect.right + RAIL_W + RAIL_GAP; }
function layoutComments(){
  const A=$("#article"),G=$("#gutter");if(!A||!G)return;
  const rect=A.getBoundingClientRect();
  const wide=railFits(rect);                              // #199: shared gate, see railFits()
  document.body.classList.toggle('gutter-on',wide);
  if(wide){
    G.classList.remove('docked');G.style.display='block';G.style.top='0px';G.style.width='284px';
    G.style.left=(rect.left+window.scrollX+rect.width+24)+'px';
    applyClamps(document);   // #387: heights must be final before the cards are stacked below; document, not G, so a Resolved panel already open during a live re-render is decided too
    // rail header pins to the article's top edge; cards stack strictly below it
    const hdr=G.querySelector('.ghdr');
    let prev=0;
    if(hdr){const ht=rect.top+window.scrollY;hdr.style.top=ht+'px';prev=ht+hdr.offsetHeight;}
    const cards=[...G.querySelectorAll('.gcard')].map(c=>{
      let top=0;const a=c._anchor;if(a){const r=a.getBoundingClientRect();top=r.top+window.scrollY;}
      return {c,top};
    }).sort((x,y)=>x.top-y.top);
    cards.forEach(o=>{const t=Math.max(o.top,prev+10);o.c.style.top=t+'px';prev=t+o.c.offsetHeight;});

    G.querySelectorAll('.gcard').forEach(c=>c.style.top='');

// coords — NO window.scroll* (unlike layoutComments' absolute #gutter, which adds scrollX at line 740).
function positionPop(){
  const pop=$("#pop");if(pop.style.display!=='block')return;   // closed: no-op (safe from the resize handler)

// live-reload: a source change re-renders the doc; a comment change re-renders the threads (so an
// agent's MCP reply/resolve appears in the open browser without a manual refresh)
function poll(){
  setInterval(async()=>{
    // Don't re-render the DOM out from under an in-progress comment gesture (button or popup open) —
    // re-rendering mid-selection is the secondary cause of "my highlight didn't take". Skip this tick;
    // the next one (2s) picks the update up once the human is done.
    if(addbtn.style.display==='block'||$("#pop").style.display==='block'||confirming||pendingPost)return;
    try{
      const s=await fetch(API+'/status',{cache:'no-store'}).then(r=>r.json());
      setEditVisible(!!s.can_edit);
      setCommentVisible(s.can_comment!==false);   // #320: a grant revoked mid-session takes effect here
      // #290: the live-reload poll is suppressed while the editor is open — it must never clobber
      // the buffer with load()'s re-render. It keeps watching /status (already fetched above, no
      // extra request) so a remote change is still detected; the human is told and chooses reload
      // vs keep-editing, per EDITACK below, rather than losing the draft to a silent re-render.
      if(EDITON){
        if(mdEdit.shouldWarnRemoteChange(true,EDITREV,s.revision)&&s.revision!==EDITACK){

        }
        return;
      }
      // the turn baton / resolved state can flip WITHOUT a source or comment change (hand_back,
      // manual resolve) — repaint the title meta line on change; /status is already in hand.
      if(s.turn!==LASTTURN||s.status!==LASTSTATUS)renderDocMeta(s);
      if(s.source_updated&&s.source_updated!==lastSrc){await fetchComments();await load();toast('Draft updated by AI');await onAgentPush();}
      else if(s.comments_updated&&s.comments_updated!==lastCmt){lastCmt=s.comments_updated;await fetchComments();renderAll();}
    }catch(e){}
