      // message, NEVER auto-resend the buffer against the fresh revision.
      let payload={};try{payload=await r.json();}catch(e){}
      const rev=(payload&&typeof payload.current_revision==='number')?payload.current_revision:null;
      showRemoteChangeNotice('This document was changed by the agent while you were editing.',rev);
      return;
    }
    if(!r.ok){ toast('Could not save');return; }
    closeEditor();
    await fetchComments();await load();await refreshDiffAvail();
    toast('Saved');
  }catch(e){ toast('Could not save'); }
  finally{ btn.disabled=false; }
}
$("#editbtn").onclick=openEditor;
$("#editcancel").onclick=requestCloseEditor;
$("#editsave").onclick=saveEditor;

// --- version history (read-only) ---
let HISTVERS=[];        // [{n,label}] versions for the compare pickers (newest-first: current, then rounds)
let HISTMODE='browse';  // 'browse' (one version at a time) | 'compare' (any-two-versions diff, #19)

async function openHistory(){
  const body=$("#histbody");body.innerHTML='Loading...';$("#histmodal").style.display='flex';
  HISTMODE='browse';$("#histcmp").textContent='Compare';
  try{
    // MR-065 (#18): the current live draft is its own top entry — "current (vN)" reconciles with the
    // dashboard's vN badge; the archived rounds (earlier drafts) list below, newest-first. Labels are
    // display-only (round-n on disk is unchanged). The per-round note count was removed (MR-064:
    // round.json no longer carries it — it was always 0 in the comments era).
    const [d,meta]=await Promise.all([fetch(API+'/history').then(r=>r.json()),fetch(API).then(r=>r.json())]);
    const rounds=(d&&d.rounds)||[];
    const rev=(meta&&meta.revision)||0;
    // Shared version list for the compare pickers: current draft first, then each archived round.
    HISTVERS=[{n:'current',label:rev>0?'current (v'+rev+')':'current'}].concat(
      rounds.map(r=>({n:String(r.round),label:'v'+r.round+' · '+new Date(r.ts*1000).toLocaleString()})));
    renderBrowse(rounds,rev);
  }catch(e){body.innerHTML='Could not load history.';}
}
function renderBrowse(rounds,rev){
  const body=$("#histbody");
  let items='<button class="histitem" data-n="current">'+(rev>0?'current (v'+rev+')':'current')+' &middot; live draft</button>';
  if(rounds.length)items+=rounds.map(r=>'<button class="histitem" data-n="'+r.round+'">v'+r.round+' &middot; earlier draft &middot; '+new Date(r.ts*1000).toLocaleString()+'</button>').join('');
  else items+='<p style="color:var(--text-muted);font-size:13px;margin:6px 2px 0">No earlier versions yet — a version is saved each time the AI pushes a revised draft.</p>';
  body.innerHTML='<div class="histlist">'+items+'</div><div id="histview"></div>';
  body.querySelectorAll('.histitem').forEach(b=>b.onclick=()=>showRound(b.dataset.n));
  showRound('current');                       // open showing the current draft, never an empty modal
}
async function showRound(n){
  const v=$("#histview");v.innerHTML='Loading...';
  try{
    const src=await versionSource(n);
    const heading=n==='current'?'current draft':'v'+n+' draft';
    const html=window.marked?marked.parse(src):escapeHtml(src);
    v.innerHTML='<h4>'+heading+'</h4><div class="histdoc">'+html+'</div>';
  }catch(e){v.innerHTML='Could not load that version.';}
}

// --- compare mode (#19): pick any two versions, render a line-level source diff ---
// Raw source ("current" via /source, an archived round via /history/{n}). Diffing raw markdown is
// deliberate: it sidesteps diffing rendered HTML/KaTeX/mermaid/attached images (a separate, larger job).
function versionSource(n){
  if(n==='current')return fetch(API+'/source',{cache:'no-store'}).then(r=>r.text());
  return fetch(API+'/history/'+n).then(r=>r.json()).then(d=>d.source||'');
}
// lineDiff + hunkify now live in /static/linediff.js so the latex viewer can share them (#207/#208).
// One implementation, required directly by tests/diff_selfcheck.js — see that file's header.

// The renderer moved to /static/linediff.js in #208 so the latex viewer draws the identical
// markup from the identical code. paintDiff is kept as a one-line seam: both callers here
// (the inline toggle and the History compare view) go through it.
const paintDiff=(host,ta,tb)=>mdDiff.renderInto(host,ta,tb);

async function renderDiff(a,b){
  const view=$("#diffview");if(!view)return;view.innerHTML='Loading...';
  try{
    const [ta,tb]=await Promise.all([versionSource(a),versionSource(b)]);
    paintDiff(view,ta,tb);                      // same renderer as the inline toggle (#207)
  }catch(e){view.innerHTML='<div class="diffempty">Could not load the diff.</div>';}
}
// #310: the wrapper that `7fcd840` (#208) dropped while moving the renderer out; everything
// below (the .cmpbar CSS, versionSource, renderDiff, paintDiff) survived that refactor untouched.
// Builds the two-picker .cmpbar from HISTVERS into #histbody and drives renderDiff on change,
// so compare goes through the same shared renderer as the inline toggle (#207/#208), not a copy.
function renderCompare(){
  const body=$("#histbody");
  if(HISTVERS.length<2){
    body.innerHTML='<p class="diffempty">Need at least two versions to compare: a version is saved each time the AI pushes a revised draft.</p>';
    return;
  }
  const opts=sel=>HISTVERS.map((v,idx)=>'<option value="'+escapeHtml(v.n)+'"'+(idx===sel?' selected':'')+'>'+escapeHtml(v.label)+'</option>').join('');
  // Default A = previous round (index 1), B = current draft (index 0): the most common "what just changed".
  body.innerHTML='<div class="cmpbar"><span>Compare</span><select id="cmpA">'+opts(1)+'</select>'
    +'<span>&rarr;</span><select id="cmpB">'+opts(0)+'</select></div>'
    +'<div id="diffview" class="diffdoc"></div>';
  const run=()=>renderDiff($("#cmpA").value,$("#cmpB").value);
  $("#cmpA").onchange=run;$("#cmpB").onchange=run;run();
}
// --- #207: inline "what changed" toggle -------------------------------------------------------
// OFF on load and STICKY once the reviewer turns it on. Sticky matters: a push while the diff is
// open must show the newer change, not close the pane at the moment it becomes most useful.
let DIFFON=false;
let PREVROUND=null;      // newest archived round, or null when there is nothing to compare against

function setDiffCount(c){
  const el=$("#diffcount");
  if(!c||!c.changed){el.hidden=true;return;}
  el.innerHTML='+'+c.add+' <span class="dm">&minus;'+c.del+'</span>';
  el.hidden=false;
}
// The button only exists once there IS a previous version; before the first agent push there is
// nothing to diff and an inert control would just raise a question it cannot answer.
async function refreshDiffAvail(){
  try{
    const d=await fetch(API+'/history').then(r=>r.json());
    const rounds=(d&&d.rounds)||[];
    PREVROUND=rounds.length?String(rounds[0].round):null;
  }catch(e){PREVROUND=null;}
  $("#difftoggle").hidden=!PREVROUND;
}
async function paintInlineDiff(){
  const pane=$("#diffpane");
  if(!PREVROUND){pane.innerHTML='<div class="diffempty">No earlier version yet — a version is saved each time the AI pushes a revised draft.</div>';return;}
  pane.innerHTML='<div class="diffempty">Loading…</div>';
  try{
    const [ta,tb]=await Promise.all([versionSource(PREVROUND),versionSource('current')]);
    setDiffCount(paintDiff(pane,ta,tb));
  }catch(e){pane.innerHTML='<div class="diffempty">Could not load the diff.</div>';}
}
// DIFFON is the single source of truth for which pane is showing. Kept separate from
// applyDiffMode so a push can RE-ASSERT the invariant without also re-triggering a repaint.
function syncDiffVisibility(){
  $("#article").hidden=DIFFON;
  $("#diffpane").hidden=!DIFFON;
  $("#difftoggle").setAttribute("aria-pressed",DIFFON?"true":"false");
}
function applyDiffMode(){
  syncDiffVisibility();
  if(DIFFON)paintInlineDiff();
}
$("#difftoggle").onclick=()=>{
  if(EDITON)return;   // #290: edit/diff are mutually exclusive; the button is also .disabled while editing
  DIFFON=!DIFFON;
  $("#difftoggle").classList.remove('hinted');   // acted on; stop advertising
  applyDiffMode();
};
// Called after the live-reload branch has already swapped the document in. HINTS ONLY when the
// diff is closed — putting the changed-line count on the button is an invitation, not a decision.
async function onAgentPush(){
  await refreshDiffAvail();
  if(DIFFON){await paintInlineDiff();syncDiffVisibility();return;}
  try{
    if(PREVROUND){
      const [ta,tb]=await Promise.all([versionSource(PREVROUND),versionSource('current')]);
      const c=mdDiff.counts(mdDiff.lineDiff(ta,tb));
      setDiffCount(c);
      if(c.changed)$("#difftoggle").classList.add('hinted');
    }
  }catch(e){}
  // Re-assert from DIFFON, ALWAYS and last. load() rebuilt #article and several awaits have gone by;
  // this guarantees a push can never leave the reviewer looking at a pane they did not open. Cheap
  // insurance for the one invariant of this feature.
  syncDiffVisibility();
}

$("#histbtn").onclick=openHistory;
$("#histcmp").onclick=()=>{
  if(!HISTVERS.length)return;                   // history not loaded yet
  HISTMODE=HISTMODE==='compare'?'browse':'compare';
  $("#histcmp").textContent=HISTMODE==='compare'?'Browse':'Compare';
  if(HISTMODE==='compare')renderCompare();
  else openHistory();
};
$("#histclose").onclick=()=>$("#histmodal").style.display='none';
$("#histmodal").onclick=e=>{if(e.target.id==='histmodal')$("#histmodal").style.display='none';};

// click a figure to zoom it full-screen; click anywhere / Esc to close
document.addEventListener('click',e=>{
  const img=e.target.closest('#article img');const lb=$("#lightbox");
  if(img){lb.querySelector('img').src=img.currentSrc||img.src;lb.style.display='flex';}
  else if(e.target.closest('#lightbox')){lb.style.display='none';}
});
// #222: Escape has ONE owner now. Each layer registers a closer that reports whether it was
// actually open, so Escape shuts the topmost open thing and nothing underneath it. Registration
// order is outermost-first: the lightbox was the only Escape handler before, and it stays last
// resort. Behaviour when the lightbox is the only thing open is unchanged.
// #290: the editor is a base-pane state (like #diffpane), not a floating overlay, and nothing can
// open on top of it in practice (#article — the only click surface for the lightbox — is hidden
// while editing). Pushed first = lowest priority = true last resort, below every real overlay.
mdKeys.pushEscape(()=>{ if(!EDITON)return false; requestCloseEditor(); return true; });
mdKeys.pushEscape(()=>{const l=$("#lightbox");if(!l||l.style.display!=='flex')return false;l.style.display='none';return true;});
mdKeys.pushEscape(()=>{const h=$("#histmodal");if(!h||h.style.display!=='flex')return false;h.style.display='none';return true;});
mdKeys.pushEscape(()=>{const p=$("#pop");if(!p||p.style.display!=='block')return false;p.style.display='none';return true;});
mdKeys.pushEscape(()=>{const s=$("#sharepop");if(!s||s.hidden)return false;s.hidden=true;return true;});
mdKeys.pushEscape(()=>{const g=$("#gitpop");if(!g||g.hidden)return false;g.hidden=true;return true;});

mdKeys.register([
  {keys:"c", label:"Toggle the comments panel",  run:()=>mdKeys.click("#cmtbtn")},
  {keys:"r", label:"Toggle resolved comments",   run:()=>mdKeys.click("#resbtn")},
  {keys:"h", label:"Open the revision history",  run:()=>mdKeys.click("#histbtn")},
  {keys:"a", label:"Add a comment",              run:()=>mdKeys.click("#addbtn")},
  // Share is hidden until the viewer knows you own the doc, so guard it: an inert row in the help
  // sheet is worse than no row.
  {keys:"s", label:"Share this document",        when:()=>{const b=$("#sharebtn");return !!b&&b.style.display!=='none';}, run:()=>mdKeys.click("#sharebtn")},
  // The composer's own submit. keepInField because you are, by definition, typing in it.
  {keys:"mod+Enter", label:"Save the comment you are writing", keepInField:true, run:()=>{
    const pop=$("#pop");
    if(pop && pop.style.display==='block') return mdKeys.click("#popsave");
    // a reply textarea: submit the Reply button inside the same card
    const ta=document.activeElement;
    if(ta && ta.tagName==='TEXTAREA'){
      const card=ta.closest('.rcard');
      const btn=card && card.querySelector('[data-act="reply"], .rbtn');
      if(btn){ btn.click(); return true; }
    }
    return false;
  }},
]);

// catch the first paint regardless of async load timing
[250,800,1600].forEach(t=>setTimeout(()=>{try{renderAll();}catch(e){}},t));

boot();

// ---- Share control: public link (#133) + named-share people panel (#134), owner-only ----
let _shareCsrf = "", _pubRight = null, _shares = [];
function _esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Grantee label: prefer the server-resolved email in the /shares payload; "" or absent means the
// account is genuinely unknown (#267), so show the opaque subject marked unresolved rather than
// dressing a raw provider:sub uid up as an address.
function _shareLabel(s){ if(s && s.email) return s.email; const raw=((s&&s.subject)||"").replace(/^user:/,""); return raw ? raw+" (unresolved)" : "(unknown)"; }
async function initShare(){
  const btn = document.getElementById("sharebtn"), pop = document.getElementById("sharepop");
  if(!btn) return;
  // Ownership gate: GET /shares → 200 (owner; carries public state + named shares) | 404 (not owner).
  let r; try{ r = await fetch(API + "/shares", {cache:"no-store"}); }catch(e){ return; }
  if(r.status !== 200) return;                        // not the owner → no Share control at all
  const d = await r.json().catch(()=>({}));
  _pubRight = d.public || null;                        // "view" or null
  _shares = d.shares || [];
  try{ _shareCsrf = ((await fetch("/auth/session",{cache:"no-store"}).then(x=>x.json())) || {}).csrf || ""; }catch(e){}
  updateShareBtn();                                    // state before first paint, not on first open
  btn.style.display = "";
  btn.addEventListener("click", e=>{ e.stopPropagation(); pop.hidden = !pop.hidden; if(!pop.hidden) renderShare(); });
  document.addEventListener("click", e=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==btn) pop.hidden = true; });
}
function shareUrl(){ return location.origin + "/review/" + encodeURIComponent(ID); }
// #181 (§08 rule 01): "Share" while private, "Shared" in --accent once a public link OR a named
// grantee exists, carrying the people count. The count is grantees (_shares), not the owner.
function updateShareBtn(){
  const btn = document.getElementById("sharebtn"); if(!btn) return;
  const n = _shares.length, shared = !!_pubRight || n > 0;
  btn.classList.toggle("shared", shared);
  btn.innerHTML = (shared ? "Shared" : "Share") + (n ? ' <span class="ct">&middot; ' + n + '</span>' : "");
}
// Clipboard write, best effort. navigator.clipboard needs a secure context and live user
// activation; where it is refused, the selected input still leaves ⌘C one keystroke away.
async function copyShareLink(input){
  try{ if(input){ input.focus(); input.select(); } }catch(e){}
  try{ await navigator.clipboard.writeText(shareUrl()); return true; }
  catch(e){ try{ return !!(input && document.execCommand("copy")); }catch(e2){ return false; } }
}
// The button CONFIRMS (§08 rule 02) — and only when the write actually landed; a refused write
// leaves it reading "Copy" rather than claiming a clipboard the user does not have.
function markCopied(done){
  const cp = document.querySelector("#sharepop #pubcopy");
  if(!cp || !done) return;
  cp.textContent = "Copied"; cp.classList.add("ok");
  setTimeout(()=>{ if(cp.isConnected){ cp.textContent = "Copy"; cp.classList.remove("ok"); } }, 2000);
}
async function refreshShares(){
  try{ const d = await fetch(API + "/shares",{cache:"no-store"}).then(r=>r.json()); _pubRight = d.public||null; _shares = d.shares||[]; }catch(e){}
}
function renderShare(){
  const pop = document.getElementById("sharepop"), on = !!_pubRight;
  updateShareBtn();
  const rows = _shares.length
    ? _shares.map(s=>'<div class="share-item"><span class="em" title="'+_esc(_shareLabel(s))+'">'+_esc(_shareLabel(s))+'</span><span class="rt">'+_esc(s.right)+'</span><button class="rm" type="button" data-subject="'+_esc(s.subject)+'" title="Remove access">&times;</button></div>').join("")
    : '<div class="share-empty">No one yet.</div>';
  pop.innerHTML =
    '<h3>Share this review</h3>' +
    '<div class="share-row"><div class="share-lbl">Public link<small>Anyone with the link can view</small></div>' +
    '<label class="switch"><input type="checkbox" id="pubtoggle"' + (on?" checked":"") + '><span class="track"></span></label></div>' +
    (on ? '<div class="share-link"><input id="publink" readonly value="' + shareUrl() + '"><button class="share-copy" id="pubcopy" type="button">Copy</button></div>' : '') +
    '<div class="share-sep"></div>' +
    '<div class="share-people"><h4>Share with people</h4>' +
    '<div class="share-list">' + rows + '</div>' +
    '<div class="share-invite"><input id="invemail" type="email" placeholder="email address" autocomplete="off">' +
    '<select id="invright"><option value="comment">Can comment</option><option value="view">Can view</option></select>' +
    '<button id="invbtn" type="button">Invite</button></div>' +
    '<div class="share-err" id="inverr" style="display:none"></div></div>';
  // Turning the link OFF is instant and needs no confirm (§08 rule 05) — it is reversible.
  pop.querySelector("#pubtoggle").addEventListener("change", async e=>{
    const t = e.target; t.disabled = true;
    let enabled = false;
    try{
      const rr = await fetch(API + "/public", {method: t.checked?"POST":"DELETE", headers:{"X-CSRF-Token":_shareCsrf}});
      if(rr.ok){ _pubRight = t.checked ? "view" : null; enabled = t.checked; }
    }catch(e){}
    renderShare();
    // §08 rule 02 — enabling puts the link on the clipboard itself; nothing asks for a second click.
    if(enabled) markCopied(await copyShareLink(document.querySelector("#sharepop #publink")));
  });
  const cp = pop.querySelector("#pubcopy");
  if(cp) cp.addEventListener("click", async ()=>{ markCopied(await copyShareLink(pop.querySelector("#publink"))); });
  pop.querySelector("#invbtn").addEventListener("click", async ()=>{
    const email = (pop.querySelector("#invemail").value||"").trim();
    const right = pop.querySelector("#invright").value;
    const err = pop.querySelector("#inverr"); err.style.display = "none";
    if(!email){ pop.querySelector("#invemail").focus(); return; }
    const btn = pop.querySelector("#invbtn"); btn.disabled = true; btn.textContent = "…";
    let rr; try{ rr = await fetch(API + "/shares", {method:"POST", headers:{"Content-Type":"application/json","X-CSRF-Token":_shareCsrf}, body:JSON.stringify({email, right})}); }
    catch(e){ btn.disabled=false; btn.textContent="Invite"; return; }
    if(rr.ok){ await refreshShares(); renderShare(); }
    else{ const j = await rr.json().catch(()=>({})); err.textContent = j.error || "Could not share."; err.style.display = "block"; btn.disabled=false; btn.textContent="Invite"; }
  });
  pop.querySelectorAll(".rm").forEach(b=>b.addEventListener("click", async ()=>{
    b.disabled = true;
    try{ await fetch(API + "/shares?subject=" + encodeURIComponent(b.dataset.subject), {method:"DELETE", headers:{"X-CSRF-Token":_shareCsrf}}); }catch(e){}
    await refreshShares(); renderShare();
  }));
}
initShare();

// ---- Git control: clone URL for git-tracked history (#379) — same shape as Share, above.
// Absent entirely (button never shown) when the backend has the feature off, or on a 404/error;
// #git_url is additive, so this never assumes the route exists.
async function initGit(){
  const btn = document.getElementById("gitbtn"), pop = document.getElementById("gitpop");
  if(!btn) return;
  let r; try{ r = await fetch(API + "/git_url", {cache:"no-store"}); }catch(e){ return; }
  if(r.status !== 200) return;
  const d = await r.json().catch(()=>({}));
  if(!d.git_url) return;
  btn.style.display = "";
  btn.addEventListener("click", e=>{ e.stopPropagation(); pop.hidden = !pop.hidden; if(!pop.hidden) renderGit(d.git_url); });
  document.addEventListener("click", e=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==btn) pop.hidden = true; });
}
async function copyPlain(text, focusSel){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ try{ const i=document.querySelector(focusSel); if(i){i.focus();i.select();} return document.execCommand("copy"); }catch(e2){ return false; } }
}
function renderGit(url){
  const pop = document.getElementById("gitpop");
  pop.innerHTML =
    '<h3>Clone this review</h3>' +
    '<div class="share-row"><div class="share-lbl">Full revision history<small>Every round, as real git commits</small></div></div>' +
    '<div class="share-link"><input id="giturl" readonly value="' + _esc(url) + '"><button class="share-copy" id="gitcopy" type="button">Copy</button></div>';
  pop.querySelector("#gitcopy").addEventListener("click", async ()=>{
    const cp = pop.querySelector("#gitcopy");
    if(await copyPlain(url, "#gitpop #giturl")){ cp.textContent = "Copied"; cp.classList.add("ok"); setTimeout(()=>{ if(cp.isConnected){ cp.textContent = "Copy"; cp.classList.remove("ok"); } }, 2000); }
  });
}
initGit();
