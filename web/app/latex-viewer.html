<!DOCTYPE html>
<!-- LaTeX paper review viewer (MR-097). Overleaf-style split: LaTeX source (line-numbered,
     highlighted) left, live server-compiled PDF right. Reuses the shared comment store verbatim
     (block_num = source line number); no turn baton. Self-contained per the repo convention.
     UI contract: Polish design rev 3, screens 04 (split) and 05 (comments off), both themes
     (#280; original layout from mockup artifact b1132f25-daf3-43d8-ba92-d41655fb68d4). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdreview · latex</title>
<script>
/* #285 pre-paint theme applier — IDENTICAL in all five page heads (dashboard, viewer,
   latex-viewer, account, admin); edit all five together. It must run synchronously in <head>,
   before first paint: account.js (which renders the toggle) is end-of-body and too late, and a
   deferred applier would flash the wrong theme. An explicit stored choice pins data-theme;
   anything else (key absent, garbage value, storage unavailable) means auto: attribute off,
   CSS follows the OS. */
(function(){try{var t=localStorage.getItem("mdr.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/theme.css">
<style>
  /* Colour tokens live in /static/theme.css (#153) — never redefine them per page. */
  /* Tokens shared with viewer.html (violet accent, blue, theme swap). */

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);
    font-size:13px;display:flex;flex-direction:column;overflow:hidden;}

  /* Rev 3 top bar (#280): 56px tall, hairline rule (--border-faint), no fill of its own. */
  .topbar{flex:0 0 56px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:0 16px;border-bottom:1px solid var(--border-faint);background:var(--bg);}
  .tb-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .home{color:var(--text-muted);text-decoration:none;font-weight:500;white-space:nowrap;font-size:13px;}
  .home:hover{color:var(--text);}
  .tb-sep{color:var(--border);}
  .filename{font-family:var(--font-mono);font-size:13px;color:var(--accent);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* Rev 3: the LATEX chip is quiet chrome (mono on --code-bg), retiring the legacy blue badge. */
  .typechip{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--text-subtle);background:var(--code-bg);border-radius:var(--r-pill);padding:2px 6px;}
  .tb-right{font-size:12px;color:var(--text-muted);letter-spacing:.03em;white-space:nowrap;font-variant-numeric:tabular-nums;}

  /* #332 3-way Source/Split/Paper switch — lives in the topbar, ALWAYS visible (it replaces the
     old <=880px-only tabbar outright, no `.tabbar` class survives: a class kept only so a test's
     selector still resolved would itself be the #265-class bug this repo documents elsewhere, a
     green check discriminating nothing. tests/latex_reskin_selfcheck.sh's RB4/RB5 select
     #viewswitch now, and assert it is visible at a WIDE width too, which is the actual behaviour
     change). #tab-src/#tab-pdf keep the ids and aria-pressed contract the old 2-state tabbar had
     (mdKeys "1"/"3", RB4/RB5) so neither needed a rewrite; #tab-split is the new third segment. */
  /* flex-shrink stays at its default (1), NOT 0: a fixed-width topbar row with `justify-content:
     space-between` puts these two new elements beside .tb-left, and .tb-left's own filename
     already truncates via text-overflow:ellipsis. flex-shrink:0 here would force ALL narrow-
     viewport squeeze onto .tb-left alone — confirmed by mutation-testing this exact property to 0,
     which clipped the ENTIRE "← Reviews | filename | LATEX" group off-screen at 600px width
     (tests/latex_reskin_selfcheck.sh has no narrower-than-800px case, so that regression would
     have shipped unnoticed). Letting these shrink toward their own min-content width instead
     shares the pressure, and #topstate (below) is hidden below 880px to buy the rest of the room. */
  .viewswitch{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface);}
  .viewswitch button{font:inherit;font-size:12px;color:var(--text-muted);background:none;border:none;
    height:26px;padding:0 11px;border-radius:var(--r-control);cursor:pointer;white-space:nowrap;}
  .viewswitch button:hover{color:var(--text);}
  .viewswitch button[aria-pressed="true"]{background:var(--code-bg);color:var(--text);font-weight:600;}
  /* Tri-state pane visibility, active at EVERY width (not gated behind a breakpoint the way the
     2-state tabbar was) — the switch is a real control now, not a narrow-viewport fallback. The
     narrow-viewport block further down still forces a column stack for Split at <=880px; these
     rules are what "Source"/"Paper" mean at ANY width, including that one. */
  body.view-source .pdfpane,body.view-source .vdiv{display:none;}
  /* .srcpane's base rule (below) is flex:0 0 46% — a real override is needed or Source mode would
     leave it sitting at 46% width with a blank 54% gap where the now-display:none pdfpane used to
     be (caught by mutation-testing this exact line out: the pane stayed display:flex, so a
     display-only assertion passed while the layout was broken — width had to be asserted too). */
  body.view-source .srcpane{flex:1;}
  body.view-paper .srcpane,body.view-paper .vdiv{display:none;}
  /* No .pdfpane{flex:1} override needed here, unlike .srcpane above: .pdfpane's OWN base rule
     (below) is already flex:1 unconditionally, so it already fills the row whenever it is the only
     visible child — confirmed by mutating a redundant copy of this rule in, which made no
     measurable difference, and mutating it back out again for the same reason. Recorded rather
     than left as dead-looking-necessary CSS someone re-adds "to be safe". */
  /* #332 joined compile-status pill: one bordered, clipped container so the status text and the
     Recompile action read as ONE control (mock scraps/04-latex.html), not two adjacent buttons.
     #pdfstate/#recompilebtn keep their ids — refreshPdf()/the #250 click handler are unchanged,
     only where these two elements SIT moved (out of the removed per-pane .pdfbar, into the topbar). */
  .compilepill{display:flex;align-items:center;height:28px;border:1px solid var(--border);
    border-radius:var(--r-control);overflow:hidden;background:var(--surface);}
  #pdfstate{display:inline-flex;align-items:center;gap:7px;height:100%;padding:0 10px;
    font-size:12px;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  #pdfstate .ic{display:flex;flex:0 0 auto;}
  #pdfstate .ic.ok{color:var(--success);}
  .compilepill .cp-sep{width:1px;height:100%;background:var(--border);flex:0 0 auto;}
  /* border-radius is set here even though overflow:hidden on the container clips it visually —
     tests/latex_reskin_selfcheck.sh's C1 reads #recompilebtn's OWN computed border-radius, and
     this keeps that assertion meaningful without depending on which element happens to clip it. */
  #recompilebtn{display:inline-flex;align-items:center;gap:6px;height:100%;padding:0 11px;
    border:none;border-radius:var(--r-control);background:var(--accent);color:var(--bg);
    font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  #recompilebtn:hover{background:var(--accent-strong);}
  #recompilebtn[disabled]{opacity:.55;cursor:default;}
  /* #332/#320: recompile is owner-only server-side (src/latex_review/module.py's _recompile
     docstring: "Auth mirrors every /api/latex arm: 401 anon, 404 non-owner" — the SAME custody
     tier #editbtn already gates on via canEdit, #291). It used to be invisible to everyone except
     while body.compile-failed, which incidentally hid this gap; making it a permanent pill segment
     removes that cover, so it needs the gate #editbtn already has, not a new one. Both start
     `hidden` in the markup (never a flash for the common view-only case) and are revealed together
     in boot() once canEdit is known — an explicit `display` beats the UA's [hidden]{display:none}
     (the .difftoggle/.srcscroll trap this file documents elsewhere), so both need saying here. */
  #recompilebtn[hidden]{display:none;}
  .compilepill .cp-sep[hidden]{display:none;}
  .split{flex:1;display:flex;min-height:0;}
  .srcpane{flex:0 0 46%;min-width:280px;display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  .vdiv{flex:0 0 5px;cursor:col-resize;background:var(--border);position:relative;}
  .vdiv::after{content:"";position:absolute;inset:0 -3px;}
  .vdiv:hover,.vdiv.drag{background:var(--accent);}
  /* #333: the recessed backdrop behind the PDF sheet is --canvas.
     The rev-3 ROOT dc.html annotates it "backdrop (--code-bg)" and #280 built to that annotation.
     The scraps/04-latex.html SCREEN draws it `background:var(--canvas)`, and the screens are the
     source of truth for this epic (that is why phase 5 exists). --canvas's own definition in
     tokens.json agrees: "recessed area behind a sheet (latex viewer)". So the screen wins.
     The other five --code-bg uses in that screen are source-pane and gutter surfaces and stay.
     The sheet ITSELF cannot take --paper: it is a real PDF drawn by the browser's native viewer
     inside the iframe, unthemable from here. It renders white regardless, which is what --paper
     is (#FFFFFF in BOTH themes, because a printed sheet does not invert), so the rendered result
     matches the mock — but by the PDF's nature, not by our token. Recorded, not papered over. */
  .pdfpane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas);}

  .panehead{flex:0 0 32px;height:32px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border-faint);
    background:var(--bg);font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);}
  .panehead .mono{font-family:var(--font-mono);text-transform:none;letter-spacing:0;font-size:12px;color:var(--text);}
  /* #189: copy the raw .tex. margin-left:auto parks it at the pane's trailing edge. */
  .panehead .headbtn{margin-left:auto;font:inherit;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--text-muted);background:none;border:1px solid var(--border);border-radius:var(--r-control);
    padding:2px 9px;cursor:pointer;}
  .panehead .headbtn:hover{color:var(--text);border-color:var(--text-muted);}
  .panehead .headbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .srcscroll{flex:1;overflow:auto;position:relative;display:flex;align-items:flex-start;}
  /* An explicit `display` BEATS the [hidden] attribute's UA display:none, so hiding the source
     pane needs saying out loud. Without this, toggling diff mode left both panes stacked (#208). */
  .srcscroll[hidden]{display:none;}
  /* The diff pane is its own scroller and must lay out as a BLOCK: .srcscroll is a flex row built
     for codecol + railcol, and reusing it put the diff header beside the rows instead of above. */
  .diffscroll{flex:1;overflow:auto;position:relative;display:block;}
  .diffscroll[hidden]{display:none;}
  /* #291: edit mode. A third source-pane view, same [hidden]-beats-flex contract as srcscroll and
     diffscroll above (an explicit display beats the UA default or two panes stack, #208's bug
     again). BLOCK layout, like diffscroll: it is a column (textarea + bottom bar), not the
     codecol+railcol row srcscroll is built for. */
  .editscroll{flex:1;display:flex;flex-direction:column;min-height:0;}
  .editscroll[hidden]{display:none;}
  .editscroll textarea{flex:1;width:100%;border:0;resize:none;padding:12px 14px;margin:0;
    font-family:var(--font-mono);font-size:13px;line-height:1.62;
    background:var(--bg);color:var(--text);outline:none;}
  .editbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;
    border-top:1px solid var(--border);background:var(--bg);}
  .editerr{flex:1;color:var(--warning);font-size:12px;line-height:1.4;}
  .editerr[hidden]{display:none;}
  /* Mutual exclusion (AC): edit mode always wins over diff mode (enterEdit forces DIFFON off), so
     this is belt-and-suspenders — the diff toggle stays inert (JS guard) and visibly says so. */
  body.editing #difftoggle{opacity:.35;pointer-events:none;}
  /* theme.css's shared .difftoggle{display:inline-flex} is an AUTHOR rule, so it beats the UA's
     [hidden]{display:none} — the explicit-display-beats-hidden trap #208 documents for .srcscroll,
     on the button itself this time. Without this gate the Diff pill renders on a fresh review that
     has never had an agent push (found by #279; same shared rule, same bug here). */
  .difftoggle[hidden]{display:none;}
  .codecol{flex:1;min-width:0;padding:12px 0 60vh;}
  .ln{display:flex;padding:1px 14px 1px 0;line-height:1.62;position:relative;}
  .ln:hover{background:var(--code-bg);}
  .ln .n{flex:0 0 46px;text-align:right;padding-right:12px;color:var(--text-subtle);opacity:.55;
    font-family:var(--font-mono);font-size:12px;user-select:none;cursor:pointer;
    font-variant-numeric:tabular-nums;padding-top:1px;}
  .ln .n:hover{opacity:1;color:var(--accent);}
  .ln .src{flex:1;font-family:var(--font-mono);font-size:13px;white-space:pre-wrap;word-break:break-word;}
  /* Rev 3 commented-line marker: inset 3px accent rule + accent-muted tint, gutter at full strength. */
  .ln.has-c{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-muted);}
  .ln.has-c .n{opacity:1;}
  .ln.flash{background:var(--accent-muted);}
  .addb{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:none;
    border-radius:var(--r-control);background:var(--accent);color:var(--bg);font-size:14px;line-height:1;cursor:pointer;
    display:none;padding:0;}
  .ln:hover .addb,.addb:focus-visible{display:block;}
  /* Rev 3 syntax mapping: commands and $math$ both take the accent (the mock colours \section and
     $\delta$ identically); % comments stay muted italic. Colours ONLY — highlightLatex() and its
     concatenated-textContent contract are untouched. */
  .tx-c{color:var(--accent);}        /* \command */
  .tx-m{color:var(--accent);}        /* $math$ */
  .tx-x{color:var(--text-subtle);font-style:italic;}   /* % comment */
  /* Inline comment highlight = the design's text-highlight idiom (screen 03): accent-muted fill
     plus a 1px accent underline, which is what keeps it legible INSIDE a .has-c line that already
     carries the accent-muted tint. */
  mark.cmt{background:var(--accent-muted);box-shadow:inset 0 -1px 0 var(--accent);color:inherit;border-radius:2px;cursor:pointer;}
  mark.cmt.active{background:var(--accent);color:var(--bg);}

  /* comment rail inside the source scroll (mockup .railcol) */
  .railcol{flex:0 0 296px;position:relative;padding:12px 12px 60vh 0;min-height:100%;}
  /* Two INDEPENDENT reasons to hide the rail, one visual rule. body.norail is the RESPONSIVE
     state, owned by layoutCards(), which rewrites it on every repaint, resize and divider drag —
     nothing else may touch it. body.rail-off is the reviewer's manual comments-off toggle (#280,
     screen 05); it survives every layoutCards() rewrite precisely because it is a distinct class.
     The rail renders only when NEITHER flag is set. */
  body.norail .railcol,body.rail-off .railcol{display:none;}
  .gcard{position:absolute;width:284px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:var(--r-card);padding:9px 11px;font-size:13px;line-height:1.4;box-shadow:var(--shadow-hair);
    transition:top .16s ease,box-shadow .15s,border-color .15s;}
  .gcard:hover,.gcard.active{box-shadow:var(--shadow-menu);border-left-color:var(--accent-strong);}
  .ghead{display:flex;gap:6px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;}
  .gref{color:var(--accent);font-weight:700;}
  .gq{color:var(--text-muted);font-style:italic;font-size:12px;max-height:48px;overflow:hidden;}
  .gdel{background:none;border:none;cursor:pointer;font:inherit;font-size:11px;color:var(--text-muted);padding:1px 5px;border-radius:var(--r-control);}
  .gdel:hover{color:var(--danger);background:var(--danger-bg);}
  .gdel.armed{color:var(--bg);background:var(--danger);font-weight:600;}
  /* #342: Resolve — always first of the .ghead actions when present, so it alone carries
     margin-left:auto (Delete, conditional, just follows it in DOM order and rides along — the
     same convention viewer.html's #287 documents). No font declared: font:inherit (not a size)
     escapes the button UA-stylesheet default, per AGENTS.md rule 6. */
  .gres{margin-left:auto;align-self:baseline;background:none;border:none;cursor:pointer;font:inherit;color:var(--text-muted);padding:1px 5px;border-radius:var(--r-control);}
  .gres:hover{color:var(--success);background:var(--success-bg);}
  /* #286: optimistic "posting a comment" card (AC9) — opacity .6 while in flight, full opacity
     with a danger edge once failed, matching the mock's two-state card. */
  .gcard.pending{opacity:.6;}
  .gcard.pending.failed{opacity:1;border-left-color:var(--danger);}
  .gpending-status{display:flex;align-items:center;gap:6px;margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);}
  .gpending-err{margin-top:6px;font-size:13px;color:var(--danger);}
  .gpending-actions{display:flex;gap:14px;margin-top:6px;font-family:var(--font-mono);font-size:11px;}
  .gpending-actions .glink{background:none;border:none;padding:0;cursor:pointer;font:inherit;color:var(--accent);}
  .gpending-actions .glink.muted{color:var(--text-subtle);}
  .gthread{display:flex;flex-direction:column;gap:5px;}
  .gentry{border-left:3px solid var(--border);background:var(--code-bg);border-radius:var(--r-control);padding:4px 8px;}
  .gentry.reviewer{border-left-color:var(--accent);background:var(--accent-muted);}
  /* Rev 3 has no blue: the agent's entries read as quiet chrome (code-bg + muted), the reviewer's
     as accent — matching the mock's ak/ag avatar treatment. */
  .gentry.agent{border-left-color:var(--border);background:var(--code-bg);}
  .grole{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--text-muted);margin-right:5px;}
  .gentry.reviewer .grole{color:var(--accent);}
  .gentry.agent .grole{color:var(--text-muted);}
  .gtext{color:var(--text);}
  .gtext>:first-child{margin-top:0;}.gtext>:last-child{margin-bottom:0;}
  .gtext p{margin:.4em 0;}.gtext code{font-family:var(--font-mono);font-size:.9em;background:var(--code-bg);padding:.5px 4px;border-radius:var(--r-control);}
  .gtext pre{background:var(--code-bg);padding:7px 9px;border-radius:var(--r-control);overflow:auto;margin:.4em 0;}
  .gtext a{color:var(--accent);}
  /* #320: view-only readers keep every READ surface and lose only the author ones. `.addb` is the
     per-line "+" the source pane draws on every repaint, so it is gated in CSS, not per element. */
  #viewonly{display:none;font-size:var(--t-meta);color:var(--text-muted);}
  body.viewonly #viewonly{display:inline;}
  body.viewonly .greply,body.viewonly .reopenbox,body.viewonly #addbtn,body.viewonly #pop,
  body.viewonly .addb,body.viewonly .gres{display:none !important;}
  /* .gres normally carries the .ghead row's only margin-left:auto (see .gres above); hiding it
     under viewonly takes that auto margin out of the flex flow too, or a viewonly reader's own
     un-engaged .gdel (the one case deletable=true reaches) would sit packed left instead of flush
     right — the same fix viewer.html's #320 CSS applies to its own .gdel. */
  body.viewonly .gdel{margin-left:auto;}
  .greply,.reopenbox{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
  .greply textarea,.reopenbox textarea{width:100%;min-height:36px;font:inherit;font-size:12.5px;border:1px solid var(--border);
    border-radius:var(--r-control);padding:6px;background:var(--bg);color:var(--text);resize:vertical;}
  .btn{font:inherit;font-size:12.5px;border-radius:var(--r-control);padding:6px 13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .btn:hover{border-color:var(--text-subtle);}
  /* #152 slice C: primary buttons (composer "Comment", "Download PDF") use the app-wide brand violet
     with --bg text, matching Basecoat's --primary on the other pages and the viewer (slice B). --bg
     text keeps contrast correct in dark mode. Like the viewer, this page stays off Basecoat's CSS on
     purpose — its preflight would strip list markers from comment-body markdown — and instead aligns
     via the shared theme.css tokens. */
  .btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .greply .btn,.reopenbox .btn{align-self:flex-end;padding:4px 12px;font-size:12px;}

  /* PDF pane. The bar carries no fill of its own (rev 3): it sits on the pane's --code-bg.
     #332: #pdfstate and #recompilebtn moved out of here into the topbar's joined .compilepill
     (mock scraps/04-latex.html has no per-pane bar at all — the pill is the only compile-status
     surface, document-level rather than pane-level). What is left is Download, which the mock's
     single screen does not show but tests/latex_stale_pdf_selfcheck.py asserts on directly (#dlbtn
     href/label after a failed-then-recovered compile), so it keeps its slot rather than being cut
     on the strength of one screen's silence. #250's Recompile is no longer gated to
     body.compile-failed — the mock shows it as a permanent pill segment, so the CONTROL is always
     present now; only its label/disabled state still tracks compile state (refreshPdf(), untouched). */
  .pdfbar{flex:0 0 32px;height:32px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border-faint);
    font-size:12px;color:var(--text-muted);}
  .pdfbar .dl{margin-left:auto;}
  .dl{text-decoration:none;}
  /* #286 D2/AC8: danger-tinted (was warning), restructured to headline / mono revision+log line /
     full-log disclosure, matching mock 11-states.html's "Compile failed" card. */
  .errbar{display:none;flex-direction:column;gap:var(--s-2);flex:0 0 auto;padding:var(--s-3) 16px;
    background:var(--danger-bg);border-bottom:1px solid var(--danger-border);color:var(--danger);font-size:12px;}
  body.compile-failed .errbar{display:flex;}
  .errbar .errhead{font-size:13px;color:var(--danger);}
  .errbar .errline{font-family:var(--font-mono);font-size:11px;color:var(--danger);}
  .errbar details{margin:0;}
  .errbar summary{cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--danger);
    text-decoration:underline;text-underline-offset:3px;list-style:none;}
  .errbar summary::-webkit-details-marker{display:none;}
  .errbar pre{margin:6px 0 0;max-height:180px;overflow:auto;white-space:pre-wrap;font-family:var(--font-mono);font-size:11px;color:var(--text);}
  /* #286 D1: indeterminate compile progress — the compiler reports queued/running/ok/failed only
     (src/latex_review/compiler.py _write_status), no percentage, so a determinate bar would be a
     lie. animation reverts to the base (non-animated) `left:0` on the SAME universal reduced-motion
     guard theme.css already carries (duration collapses to .01ms, 1 iteration, fill-mode default
     'none'), which is what makes the D1 "static tint" fallback a partial-width bar sitting still
     at the left edge rather than a bar frozen mid-sweep. */
  .compileprogress{display:none;height:2px;border-radius:2px;background:var(--code-bg);overflow:hidden;position:relative;}
  body.compile-running .compileprogress{display:block;}
  .compileprogress .fill{position:absolute;top:0;left:0;width:40%;height:100%;background:var(--accent);
    animation:barslide 1.1s ease-in-out infinite;}

  #resolved{display:none;position:fixed;right:18px;bottom:70px;z-index:55;width:340px;max-height:64vh;overflow:auto;

  @media (max-width:880px){

          the one a URL-fragment approach would reach for. Tested at TOP-LEVEL navigation (the
          strongest form of the test — no iframe indirection to blame) against a real
          Page.printToPDF-generated PDF in this repo's actual headless Chrome (150.0.7871.188):
          #zoom=50/100/250/300 and #toolbar=0 all produced byte-identical renders to a plain load.
          Chrome's current PDFium viewer ignores the parameter entirely; it is not a Chrome-vs-

     A fourth option, a JS PDF renderer (pdf.js/canvas) that this app fully controls the zoom of the

     control added to an existing toolbar, and outside this ticket's file ownership (latex-

  button:focus-visible,a:focus-visible,.ln .n:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

<script src="/static/linediff.js"></script>
<script src="/static/marked.min.js"></script>
<!-- Before the inline block: it registers bindings at parse time and needs window.mdKeys. -->
<script src="/static/keys.js"></script>
<script>
const $=s=>document.querySelector(s);
const ID=location.pathname.split('/').pop();
const API='/api/reviews/'+ID, LATEX='/api/latex/'+ID;
let comments=[], cur=null, confirming=null, lastSrc=0, lastCmt=0, pdfRev=null;
// #286: the optimistic "posting a comment" card. Set by createComment() before the POST resolves;
// null once it settles (2xx) or the human discards a failed one. Non-null blocks the live poll's
// full renderComments() (same reason `confirming` already does for an armed delete), and
// renderComments() itself paints the extra card whenever this is set.
let pendingPost=null;
// #286: shared arc spinner (theme.css's .spin keyframe + reduced-motion guard). Two sizes per the
// mock: 14px for the Compiling bar, 12px for a "posting…" comment card.
const SPIN_ICON='<svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
const SPIN_ICON_SM='<svg class="spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
// #332: the compiled-pill's success check, matching the mock's --success-coloured icon beside
// "Compiled Nm ago". Wrapped in .ic so #pdfstate's own CSS can size/space it identically across
// every state (spinner while running, this while ok, plain text while failed).
const CHECK_ICON='<span class="ic ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>';
// #332: "Compiled Nm ago" reads off finished_at (epoch seconds, written by compiler.py's
// _write_status for every ok/failed status — see src/latex_review/compiler.py). Returns null
// rather than guessing when the field is absent (a legacy status file predating it, or a state
// where the server never sets it) so the caller can fall back to an honest label instead of
// printing "NaNm ago". Recomputed fresh on every refreshPdf() call, which the 2s poll already
// drives, so the label ages correctly without a dedicated timer.
function timeAgo(ts){
  if(!ts)return null;
  const s=Math.max(0,Date.now()/1000-ts);
  if(s<60)return 'just now';
  const m=Math.floor(s/60);if(m<60)return m+'m ago';
  const h=Math.floor(m/60);if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
// #280 comments-off (design screen 05). Session-only, rail ON on load — same persistence contract
// as diff mode (OFF on load, sticky within the session). This flag must NEVER be body.norail:
// layoutCards() rewrites norail on every repaint, resize and divider drag, so a toggle that
// reused it would be silently reverted by the next 2s comment poll. body.rail-off is the manual
// flag; the CSS hides the rail when EITHER class is present.
let RAILOFF=false;

// String() first: comment anchors arrive as NUMBERS from API/MCP authors, and Number.replace is
// a TypeError that killed renderComments() mid-pass (found by #279 on the markdown viewer; the
// same helper lives here). A half-drawn render is worse than a wrong label.
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const esc=escapeHtml;

// ---- LaTeX line highlighting: split a line into command / comment / math / text spans. The
// concatenated textContent of .src equals the raw line, so comment offsets map cleanly. ----
function highlightLatex(line){
  let out='', i=0;
  const push=(cls,txt)=>{out+=cls?'<span class="'+cls+'">'+esc(txt)+'</span>':esc(txt);};
  while(i<line.length){
    const ch=line[i];
    if(ch==='%'){push('tx-x',line.slice(i));break;}
    if(ch==='\\'){
      const m=/^\\([A-Za-z]+\*?|.)/.exec(line.slice(i));
      const tok=m?m[0]:ch;push('tx-c',tok);i+=tok.length;continue;
    }
    if(ch==='$'){
      const rest=line.slice(i+1);const end=rest.indexOf('$');
      if(end>=0){push('tx-m',line.slice(i,i+2+end));i+=2+end;continue;}
    }
    let j=i+1;while(j<line.length&&!'%\\$'.includes(line[j]))j++;
    push('',line.slice(i,j));i=j;
  }
  return out;
}

// #189: the raw .tex exactly as /source returned it. Rendering interleaves gutter numbers into the
// DOM, so reading the copy back off .ln would not round-trip. loadSource() is re-invoked by the
// live-reload path, so this tracks the current revision rather than the one present at boot.
let rawSource='';

async function loadSource(){
  const t=await (await fetch(API+'/source',{cache:'no-store'})).text();
  rawSource=t;
  const col=$('#codecol');col.innerHTML='';
  const lines=t.split('\n');
  lines.forEach((line,idx)=>{
    const n=idx+1;
    const d=document.createElement('div');d.className='ln';d.dataset.num=String(n);d.id='L'+n;
    d.innerHTML='<span class="n" tabindex="0" title="Comment on line '+n+'">'+n+'</span>'+
      '<span class="src">'+highlightLatex(line)+'</span>';
    col.appendChild(d);
  });
  $('#srcmeta').textContent=' · '+lines.length+' lines';
  wireLineAffordances();
  renderComments();
}

// ---- #208: diff mode in the source pane -------------------------------------------------------
// Same contract as the markdown viewer (#207): OFF on load, STICKY once opened, and a push only
// ever hints. Only the source pane swaps; the PDF pane and the compile bar are untouched.
let DIFFON=false;
let PREVROUND=null;      // newest archived round, or null when there is nothing to compare against
// #291: edit mode. EDITON gates the third source-pane view (syncDiffVisibility above); editRevision
// is the #288 precondition token, taken ONLY from the GET /source response that seeds the textarea
// (never a separate /status fetch — that ordering is the lost-update bug the guard exists to
// prevent); canEdit mirrors /status.can_edit, read once at boot like the Share button's ownership
// gate (both viewers already poll /status, so this adds no requests).
let EDITON=false, editRevision=null, canEdit=false;
// #320: /status.can_comment, the gate POST /comments enforces. Defaults TRUE so a server without
// the key behaves exactly as before. See viewer.html for the full note; both viewers share it.
let CAN_COMMENT=true;
function setCommentVisible(can){
  CAN_COMMENT=can;
  document.body.classList.toggle('viewonly',!can);
  if(!can){const a=$('#addbtn');if(a)a.style.display='none';const p=$('#pop');if(p)p.style.display='none';}
}

function setDiffCount(c){
  const el=$('#diffcount');
  if(!c||!c.changed){el.hidden=true;return;}
  el.innerHTML='+'+c.add+' <span class="dm">&minus;'+c.del+'</span>';
  el.hidden=false;
}
// The button only appears once an earlier version exists — before the first agent push there is
// nothing to diff, and an inert control would raise a question it cannot answer.
async function refreshDiffAvail(){
  try{
    const d=await (await fetch(API+'/history',{cache:'no-store'})).json();
    const rounds=(d&&d.rounds)||[];
    PREVROUND=rounds.length?String(rounds[0].round):null;   // rounds are newest-first
  }catch(e){PREVROUND=null;}
  $('#difftoggle').hidden=!PREVROUND;
}
async function versionSource(n){
  if(n==='current')return (await fetch(API+'/source',{cache:'no-store'})).text();
  const d=await (await fetch(API+'/history/'+n)).json();
  return d.source||'';
}
async function paintTexDiff(){
  const pane=$('#texdiffpane');
  if(!PREVROUND){pane.innerHTML='<div class="diffempty">No earlier version yet — a version is saved each time the AI pushes a revised draft.</div>';return;}
  pane.innerHTML='<div class="diffempty">Loading…</div>';
  try{
    const [ta,tb]=await Promise.all([versionSource(PREVROUND),versionSource('current')]);
    setDiffCount(mdDiff.renderInto(pane,ta,tb));
  }catch(e){pane.innerHTML='<div class="diffempty">Could not load the diff.</div>';}
}
// DIFFON is the single source of truth for which pane shows; kept separate so a push can
// re-assert it without also re-triggering a repaint. #291: EDITON is a THIRD pane sharing the same
// slot, and it always wins — enterEdit() forces DIFFON off before opening, so the two are never
// both true, but this stays defensive rather than trusting that invariant silently.
function syncDiffVisibility(){
  $('#srcscroll').hidden=DIFFON||EDITON;
  $('#texdiffpane').hidden=!DIFFON||EDITON;
  $('#editpane').hidden=!EDITON;
  $('#difftoggle').setAttribute('aria-pressed',DIFFON?'true':'false');
  document.body.classList.toggle('editing',EDITON);
}
function applyDiffMode(){
  syncDiffVisibility();
  if(DIFFON)paintTexDiff();
}
async function onAgentPush(){
  await refreshDiffAvail();
  if(DIFFON){await paintTexDiff();syncDiffVisibility();toast('Draft updated by AI');return;}
  let changed=0;
  try{
    if(PREVROUND){
      const [ta,tb]=await Promise.all([versionSource(PREVROUND),versionSource('current')]);
      const c=mdDiff.counts(mdDiff.lineDiff(ta,tb));
      setDiffCount(c);changed=c.changed;
      if(c.changed)$('#difftoggle').classList.add('hinted');
    }
  }catch(e){}
  // The toast is where the reviewer learns their paper was rewritten, so it is where the way to
  // see it belongs. Clicking is the reviewer ASKING — that is the one case where opening the diff
  // for them is correct, and it is still their action, not the push's.
  // #291: not while EDITON — the action would flip DIFFON under an open editor, and syncDiffVisibility
  // keeps the edit pane on top regardless, so the click would silently do nothing visible. Plain
  // notice instead; the diff is still one click away once they finish or cancel.
  if(changed&&!EDITON)toastAction('Draft updated by AI','See what changed',()=>{DIFFON=true;$('#difftoggle').classList.remove('hinted');applyDiffMode();});
  else toast('Draft updated by AI');
  // Re-assert from DIFFON, always and last: loadSource() has just rebuilt the pane and several
  // awaits have passed, so this guarantees a push cannot leave the reviewer in a pane they did
  // not open.
  syncDiffVisibility();
}

// ---- comments: same store + CRUD as viewer.html, block_num = line number ----
async function fetchComments(){
  try{const d=await (await fetch(API+'/comments',{cache:'no-store'})).json();comments=(d&&d.comments)||[];}catch(e){}
}
// #320: these three posted WITHOUT checking r.ok, so a refused comment still toasted "Comment
// added" and vanished on the next repaint — a worse failure than viewer.html's, which at least
// said something was wrong. Same helper as viewer.html now: 401 -> sign in, 404 -> the custody
// policy refused the note (view-only share, or a public link with no named grant), and the flag is
// re-gated so a grant revoked mid-session settles here.
function commentDenied(r,fallback){
  if(r.status===401){toast('Sign in to comment');return true;}
  if(r.status===404){setCommentVisible(false);toast('You have view-only access to this document');return true;}
  if(!r.ok){toast(fallback);return true;}
  return false;
}
// #286: optimistic post. Renders the pending card (via renderComments(), below) immediately, then
// resolves it: 2xx clears pendingPost and the normal fetch+repaint takes over (the pending card is
// gone, replaced by the real one); a network error or non-2xx leaves pendingPost.failed=true so
// renderComments() keeps showing the SAME card with "Not posted — your text is kept." + retry
// (calls this again with the identical anchor/text) / discard (clears pendingPost and repaints).
async function createComment(anchor,text){
  pendingPost={anchor:anchor,text:text,failed:false};
  renderComments();
  return submitPendingPost();
}
async function submitPendingPost(){
  if(!pendingPost)return true;   // discarded before this call started
  pendingPost.failed=false;
  let r;
  try{
    r=await fetch(API+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({anchor:pendingPost.anchor,text:pendingPost.text})});
  }catch(e){ pendingPost.failed=true; renderComments(); return false; }
  if(commentDenied(r,'Could not save comment')){ pendingPost.failed=true; renderComments(); return false; }
  pendingPost=null;
  await fetchComments();renderComments();toast('Comment added');return true;
}
function discardPending(){ pendingPost=null; renderComments(); }
function pendingCardHtml(p){
  if(!p.failed)
    return '<div class="gcard pending"><div class="ghead"><span class="gref"></span></div>'+
      '<span class="gq"></span><div class="gtext">'+esc(p.text)+'</div>'+
      '<div class="gpending-status">'+SPIN_ICON_SM+'posting…</div></div>';
  return '<div class="gcard pending failed"><div class="ghead"><span class="gref"></span></div>'+
    '<span class="gq"></span><div class="gtext">'+esc(p.text)+'</div>'+
    '<div class="gpending-err">Not posted — your text is kept.</div>'+
    '<div class="gpending-actions"><button type="button" class="glink" data-act="retry">retry</button>'+
    '<button type="button" class="glink muted" data-act="discard">discard</button></div></div>';
}
function wirePendingCard(el){
  const retry=el.querySelector('[data-act=retry]');if(retry)retry.onclick=e=>{e.stopPropagation();submitPendingPost();};
  const discard=el.querySelector('[data-act=discard]');if(discard)discard.onclick=e=>{e.stopPropagation();discardPending();};

// Comment body is UNTRUSTED: escape first, then marked, then strip javascript:/data: urls.
function mdComment(raw){
  raw=raw||'';
  const html=window.marked?marked.parse(esc(raw),{breaks:true}):esc(raw).replace(/\n/g,'<br>');
  const tpl=document.createElement('template');tpl.innerHTML=html;
  tpl.content.querySelectorAll('a[href]').forEach(a=>{
    if(/^(https?:|mailto:)/i.test(a.getAttribute('href')||'')){a.target='_blank';a.rel='noopener noreferrer';}
    else a.removeAttribute('href');});
  tpl.content.querySelectorAll('img[src]').forEach(im=>{if(!/^(https?:|data:image\/)/i.test(im.getAttribute('src')||''))im.removeAttribute('src');});
  return tpl.innerHTML;
}

// Offset-mapped highlight: find the quote in the line's .src textContent, then wrap each
// intersecting text-node slice in its own <mark> (a Range spanning element boundaries cannot be
// surroundContents'd, so we wrap per segment). Exact-line lookup first, then a whole-file scan.
function markInSrc(srcEl,qt,cid){
  const txt=srcEl.textContent;const start=txt.indexOf(qt);if(start<0)return false;
  const end=start+qt.length;
  const walker=document.createTreeWalker(srcEl,NodeFilter.SHOW_TEXT);
  const nodes=[];let node;while(node=walker.nextNode())nodes.push(node);
  let pos=0;const slices=[];
  nodes.forEach(n=>{const ns=pos,ne=pos+n.nodeValue.length;pos=ne;
    const s=Math.max(start,ns),e=Math.min(end,ne);if(s<e)slices.push([n,s-ns,e-ns]);});
  let wrapped=false;
  slices.forEach(([n,a,b])=>{const r=document.createRange();r.setStart(n,a);r.setEnd(n,b);
    const mk=document.createElement('mark');mk.className='cmt';mk.dataset.id=cid;
    try{r.surroundContents(mk);wrapped=true;}catch(e){}});
  return wrapped;
}
function highlightComment(c){
  const qt=c.anchor&&c.anchor.quoted_text;if(!qt)return null;
  const named=document.querySelector('.ln[data-num="'+(c.anchor.block_num||'')+'"]');
  const lines=named&&named.querySelector('.src').textContent.includes(qt)?[named]:[...document.querySelectorAll('.ln')];
  for(const ln of lines){if(markInSrc(ln.querySelector('.src'),qt,c.comment_id))return ln;}
  return null;
}

function wireCards(root){

// ---- PDF pane: compile status + iframe reload + download + error banner ----
// #286 D1/D2/AC7/AC8: indeterminate progress bar + spinner while running, danger-tinted failure
// card with the mock's headline and #205's revision detail kept on the mono line + Download label.
async function refreshPdf(){
  let st=null;
  try{const r=await fetch(LATEX+'/compile',{cache:'no-store'});if(r.ok)st=await r.json();}catch(e){}
  const bar=$('#pdfstate'),msg=$('#pdfmsg'),frame=$('#pdfframe'),dl=$('#dlbtn');
  if(!st){bar.textContent='PDF';document.body.classList.remove('compile-running');return;}
  const rev=st.revision;
  if(st.state==='ok'){
    document.body.classList.remove('compile-running');
    // #332: the mock's pill reads "Compiled Nm ago", not the old "PDF · vN · compiled" — the
    // revision number moves nowhere else because nothing here still tests for it (only the
    // COMPILING-state text is asserted, by scripts/loading-states-check.mjs).
    bar.innerHTML=CHECK_ICON+' Compiled '+(timeAgo(st.finished_at)||'just now');
    document.body.classList.remove('compile-failed');
    // #205: a return to ok must CLEAR the staleness dressing the failed branch applied, or the
    // Download button keeps advertising an old revision after the compile recovered.
    dl.href=LATEX+'/pdf'; dl.textContent='Download PDF'; dl.removeAttribute('title');
    msg.style.display='none';
    if(pdfRev!==rev){pdfRev=rev;frame.src=LATEX+'/pdf?v='+rev;}   // reload only on a new build
  }else if(st.state==='failed'){
    // #205. Two bugs lived here. On a COLD load (fresh page, no prior 'ok' this session) pdfRev was
    // null, so the viewer announced "No PDF yet" and never set frame.src — while a perfectly good
    // PDF sat on disk. And #dlbtn kept whatever href the 'ok' branch last gave it, so Download
    // handed over a previous revision's document with no indication it was stale.
    // Both are answered by the SERVER now (has_pdf / pdf_revision) rather than by session memory.
    document.body.classList.remove('compile-running');
    // #332: the pill's short summary; the WHY (which revision, the l.NNN pointer) still lives in
    // #errline below, unchanged — this line only ever named the same two facts twice.
    bar.textContent='Compile failed';
    document.body.classList.add('compile-failed');
    const rb=$('#recompilebtn'); if(rb){ rb.disabled=false; rb.textContent='Recompile'; }  // #250: verdict is in
    const fullLog=st.log_tail||'(no log)';
    $('#errlog').textContent=fullLog;
    // AC8: surface the log's own pointer to the failing line on the mono line, distinct from the
    // full log the "full log" disclosure reveals underneath. Two REAL shapes exist, checked
    // against this backend's actual compiler.py output (never against the mock's example alone):
    // classic engines write "l.<num> ..." into their .log file, but src/latex_review/compiler.py
    // captures the tectonic PROCESS's own stdout/stderr as log_tail, and tectonic's line pointer
    // reads "error: paper.tex:<num>: <message>" instead — verified with a direct `tectonic -X
    // compile` run on an undefined-control-sequence fixture. Both are matched so the pointer line
    // is real against what this backend ships, not just against the mock's literal l.214 example.
    const lLine=(fullLog.split('\n').find(l=>/^\s*l\.\d/.test(l)||/error:.*:\d+:/.test(l))||'').trim();
    // "unknown" is deliberate for status files written before pdf_revision existed. st.revision is
    // the ATTEMPTED revision — displaying it here would name a revision whose PDF was never built.
    const shownRev = (st.pdf_revision!=null) ? ('v'+st.pdf_revision)
                   : (pdfRev!=null ? ('v'+pdfRev) : null);
    if(st.has_pdf){
      // D2: the mock's sentence is the headline; #205's revision detail (which vN failed, which
      // vM is shown) moves to the mono line below it, alongside the l.NNN pointer AC8 asks for —
      // and the Download label two lines down keeps naming the shown revision, unchanged.
      $('#errhead').textContent='Compile failed — the last good PDF is still shown.';
      $('#errline').textContent='v'+rev+' failed — showing '+(shownRev||'an earlier revision (unknown)')+(lLine?' · '+lLine:'');
      // Render the surviving PDF on a cold load too; the ok-branch guard never ran.
      if(frame.src.indexOf(LATEX+'/pdf')===-1) frame.src=LATEX+'/pdf?stale='+rev;
      msg.style.display='none';
      // Say what it is, rather than silently handing over a document the reader thinks is current.
      dl.href=LATEX+'/pdf';
      dl.textContent='Download '+(shownRev||'an earlier revision');
      dl.title='The current compile (v'+rev+') failed. This downloads '+(shownRev||'an earlier revision')+'.';
    }else{
      // The mock's sentence would be a lie with nothing on screen — no PDF exists to still show.
      $('#errhead').textContent='Compile failed — no PDF has been produced yet.';
      $('#errline').textContent='v'+rev+' failed'+(lLine?' · '+lLine:'');
      msg.textContent='No PDF yet — the compile failed. See the log above.';
      msg.style.display='flex';
      dl.removeAttribute('href');            // nothing to download; do not offer a dead link
      dl.textContent='Download PDF';
      dl.title='No PDF has been produced yet.';
    }
  }else{
    // queued|running: AC7's spinner + "Compiling <name>…", <name> the same string #filename
    // shows. #filename starts as the literal "loading…" until boot()'s meta fetch resolves; fall
    // back to a neutral word rather than compounding that placeholder into "Compiling loading…".
    document.body.classList.add('compile-running');
    const fn=$('#filename').textContent;
    const docName=(fn&&fn!=='loading…')?fn:'the document';
    bar.innerHTML=SPIN_ICON+' Compiling '+esc(docName)+'…';
    if(pdfRev==null){msg.textContent='Compiling…';msg.style.display='flex';}
    // #250: while the server says queued/running, the control stays in-progress — state from the
    // poll, not a client timer. (body.compile-failed is still set from the failed round, so the
    // button remains visible until the verdict.)
    const rb=$('#recompilebtn'); if(rb){ rb.disabled=true; rb.textContent='Recompiling…'; }
  }
}

// ---- live poll: source / comments / compile status off the same interval ----
function poll(){
  setInterval(async()=>{
    if(addbtn.style.display==='block'||$('#pop').style.display==='block'||confirming||pendingPost)return;
    try{
      const s=await fetch(API+'/status',{cache:'no-store'}).then(r=>r.json());
      setCommentVisible(s.can_comment!==false);   // #320: mid-session grant change settles here
      if(s.source_updated&&s.source_updated!==lastSrc){lastSrc=s.source_updated;await fetchComments();await loadSource();await onAgentPush();}
      else if(s.comments_updated&&s.comments_updated!==lastCmt){lastCmt=s.comments_updated;await fetchComments();renderComments();}
    }catch(e){}
    refreshPdf();
  },2000);
}

// ---- divider drag, tabs, dock, boot ----
(function(){

  div.addEventListener('pointermove',e=>{if(!drag)return;const r=$('.split').getBoundingClientRect();
    const pct=Math.min(72,Math.max(24,(e.clientX-r.left)/r.width*100));src.style.flexBasis=pct+'%';layoutCards();});

  // #332: 3-way Source/Split/Paper, replacing the old show-pdf boolean. body.view-source and
  // body.view-paper are mutually exclusive and width-independent (see the CSS above); Split is
  // simply neither class, the pre-#332 default. layoutCards() at the end is NOT optional — hiding
  // .srcpane (Paper mode) collapses its clientWidth to 0, which is exactly the "pane too narrow"
  // condition layoutCards() already tests for the RESPONSIVE case, so switching TO Paper falls
  // back to the floating #cmtdock for comments (a reasonable reuse: the rail lives inside the
  // hidden source pane's DOM, so it has nowhere to render), and switching AWAY from Paper must
  // recompute clientWidth again to decide whether the rail (and, within it, body.rail-off's
  // MANUAL state — untouched by any of this, see #280/D2) governs #cmtbtn once more.
  function setView(mode){

  }
  $('#tab-src').onclick=()=>setView('source');
  $('#tab-split').onclick=()=>setView('split');
  $('#tab-pdf').onclick=()=>setView('paper');
  // #280: at rail-capable pane widths the button toggles the RAIL (manual comments-off, screen
  // 05); narrow keeps toggling the dock exactly as before. Re-showing re-runs layoutCards()
  // because the cards were position:absolute-laid-out while display:none (offsetHeight 0), so
  // their stacked tops are stale until a post-show pass recomputes them.
  $('#cmtbtn').onclick=()=>{

let tTimer=null;
function toast(m){const t=$('#toast');t.classList.remove('hasaction');t.textContent=m;t.style.opacity=1;clearTimeout(tTimer);tTimer=setTimeout(()=>t.style.opacity=0,1800);}
// Toast carrying one action. Used for "the AI rewrote your paper — see what changed", which is the
// moment the question is raised, so it is the right place to answer it. Longer-lived than a plain
// toast because a 1.8s window is not long enough to read a sentence and then aim at a button.
function toastAction(m,label,fn,ms){
  const t=$('#toast');
  t.classList.add('hasaction');
  t.innerHTML='<span></span><button type="button" class="toastbtn"></button>';

  t.style.opacity=1;clearTimeout(tTimer);tTimer=setTimeout(()=>{t.style.opacity=0;t.classList.remove('hasaction');},ms||7000);

// #189: AWAIT the write. writeText returns a promise, so a synchronous try/catch around it cannot
// see a rejection and would report success while the clipboard stayed empty (denied permission,
// non-secure context, unfocused document). Failure has to be visibly distinct from success.
$('#copysrc').addEventListener('click',async()=>{
  try{ await navigator.clipboard.writeText(rawSource); toast('Source copied'); }
  catch(e){ toast('Copy failed — '+(e&&e.name?e.name:'clipboard unavailable')); }
});

async function boot(){

    $('#filename').textContent=(meta.source_path||meta.title||'paper')+'';
    const p=(meta.project?meta.project+' · ':'');$('#topstate').textContent=p+'v'+(meta.revision||0);
    $('#srcname').textContent='paper.tex';}catch(e){}
  await fetchComments();await loadSource();await refreshPdf();
  // Seed the live-reload cursors from the current status BEFORE polling, or the first tick sees
  // lastSrc/lastCmt at their initial 0 and falsely fires a "Draft updated by AI" reload on a
  // review nothing changed (mirrors viewer.html's load()).
  try{const s=await (await fetch(API+'/status',{cache:'no-store'})).json();
    lastSrc=s.source_updated||0;lastCmt=s.comments_updated||0;
    // #291: can_edit (#288) is the SAME custody can_write the PUT arm enforces — owner on both
    // tiers, false for a comment/view grantee. One extra field off a request the page already
    // makes, not a new one.
    canEdit=!!s.can_edit;$('#editbtn').hidden=!canEdit;

// ---- Share control: public link (#133) + named-share people panel (#134), owner-only ----
// Copied verbatim from viewer.html so the latex viewer shows the same panel (#152 share-parity).
// Depends only on API/ID (defined above) + the #sharebtn/#sharepop topbar markup. Keep in sync.
let _shareCsrf = "", _pubRight = null, _shares = [];
function _esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Grantee label: prefer the server-resolved email in the /shares payload; "" or absent means the
// account is genuinely unknown (#267), so show the opaque subject marked unresolved rather than
// dressing a raw provider:sub uid up as an address.
function _shareLabel(s){ if(s && s.email) return s.email; const raw=((s&&s.subject)||"").replace(/^user:/,""); return raw ? raw+" (unresolved)" : "(unknown)"; }
async function initShare(){
  const btn = document.getElementById("sharebtn"), pop = document.getElementById("sharepop");
  if(!btn) return;
  // Ownership gate: GET /shares → 200 (owner; carries public state + named shares) | 404 (not owner).
  let r; try{ r = await fetch(API + "/shares", {cache:"no-store"}); }catch(e){ return; }
  if(r.status !== 200) return;                        // not the owner → no Share control at all
  const d = await r.json().catch(()=>({}));
  _pubRight = d.public || null;                        // "view" or null
  _shares = d.shares || [];
  try{ _shareCsrf = ((await fetch("/auth/session",{cache:"no-store"}).then(x=>x.json())) || {}).csrf || ""; }catch(e){}
  btn.style.display = "";
  btn.addEventListener("click", e=>{ e.stopPropagation(); pop.hidden = !pop.hidden; if(!pop.hidden) renderShare(); });
  document.addEventListener("click", e=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==btn) pop.hidden = true; });
}
function shareUrl(){ return location.origin + "/review/" + encodeURIComponent(ID); }
async function refreshShares(){
  try{ const d = await fetch(API + "/shares",{cache:"no-store"}).then(r=>r.json()); _pubRight = d.public||null; _shares = d.shares||[]; }catch(e){}
}
function renderShare(){
  const pop = document.getElementById("sharepop"), on = !!_pubRight;
  const rows = _shares.length
    ? _shares.map(s=>'<div class="share-item"><span class="em" title="'+_esc(_shareLabel(s))+'">'+_esc(_shareLabel(s))+'</span><span class="rt">'+_esc(s.right)+'</span><button class="rm" type="button" data-subject="'+_esc(s.subject)+'" title="Remove access">&times;</button></div>').join("")
    : '<div class="share-empty">No one yet.</div>';
  pop.innerHTML =
    '<h3>Share this review</h3>' +
    '<div class="share-row"><div class="share-lbl">Public link<small>Anyone with the link can view</small></div>' +
    '<label class="switch"><input type="checkbox" id="pubtoggle"' + (on?" checked":"") + '><span class="track"></span></label></div>' +
    (on ? '<div class="share-link"><input id="publink" readonly value="' + shareUrl() + '"><button class="share-copy" id="pubcopy" type="button">Copy</button></div>' : '') +
    '<div class="share-sep"></div>' +
    '<div class="share-people"><h4>Share with people</h4>' +
    '<div class="share-list">' + rows + '</div>' +
    '<div class="share-invite"><input id="invemail" type="email" placeholder="email address" autocomplete="off">' +
    '<select id="invright"><option value="comment">Can comment</option><option value="view">Can view</option></select>' +
    '<button id="invbtn" type="button">Invite</button></div>' +
    '<div class="share-err" id="inverr" style="display:none"></div></div>';
  pop.querySelector("#pubtoggle").addEventListener("change", async e=>{
    const t = e.target; t.disabled = true;
    try{
      const rr = await fetch(API + "/public", {method: t.checked?"POST":"DELETE", headers:{"X-CSRF-Token":_shareCsrf}});
      if(rr.ok) _pubRight = t.checked ? "view" : null;
    }catch(e){}
    renderShare();
  });
  const cp = pop.querySelector("#pubcopy");
  // #213: this said "Copied" whether or not anything was copied. TWO defects, not one:
  //   1. writeText returns a PROMISE, so the try/catch only ever caught a synchronous throw. A
  //      rejected permission (the common real failure) sailed straight past it.
  //   2. "Copied" was set unconditionally on the next line regardless.
  // The result was a UI that confidently reported success while the clipboard was untouched, which
  // is worse than no feedback: the reader pastes a stale buffer somewhere else and blames that.
  // Follows the pattern #copysrc in this same file already uses: await, then say what happened.
  // A silent no-op on failure would not satisfy this ticket either — the failure must be VISIBLE.
  if(cp) cp.addEventListener("click", async ()=>{
    const i = pop.querySelector("#publink"); i.select();
    try{
      await navigator.clipboard.writeText(i.value);
      cp.textContent = "Copied";
      setTimeout(()=>{ cp.textContent = "Copy"; }, 1400);
    }catch(e){
      // Name the reason: "it didn't work" sends people to the wrong place. The link stays
      // selected above, so manual copy is still available and worth implying.
      cp.textContent = "Copy failed";
      toast('Copy failed — '+((e && e.name) ? e.name : 'clipboard unavailable')+'. The link is selected; copy it manually.');
      setTimeout(()=>{ cp.textContent = "Copy"; }, 2600);
    }
  });
  pop.querySelector("#invbtn").addEventListener("click", async ()=>{
    const email = (pop.querySelector("#invemail").value||"").trim();
    const right = pop.querySelector("#invright").value;
    const err = pop.querySelector("#inverr"); err.style.display = "none";
    if(!email){ pop.querySelector("#invemail").focus(); return; }
    const btn = pop.querySelector("#invbtn"); btn.disabled = true; btn.textContent = "…";
    let rr; try{ rr = await fetch(API + "/shares", {method:"POST", headers:{"Content-Type":"application/json","X-CSRF-Token":_shareCsrf}, body:JSON.stringify({email, right})}); }
    catch(e){ btn.disabled=false; btn.textContent="Invite"; return; }
    if(rr.ok){ await refreshShares(); renderShare(); }
    else{ const j = await rr.json().catch(()=>({})); err.textContent = j.error || "Could not share."; err.style.display = "block"; btn.disabled=false; btn.textContent="Invite"; }
  });
  pop.querySelectorAll(".rm").forEach(b=>b.addEventListener("click", async ()=>{
    b.disabled = true;
    try{ await fetch(API + "/shares?subject=" + encodeURIComponent(b.dataset.subject), {method:"DELETE", headers:{"X-CSRF-Token":_shareCsrf}}); }catch(e){}
    await refreshShares(); renderShare();
  }));
}
initShare();

// ---- #291: edit mode — swap #srcscroll for a textarea over the .tex source. Save rides the same
// PUT /source the MCP path uses, widened by #288 (If-Match precondition) and #289 (session-keyed
// CSRF + reviewer attribution). Two DISTINCT server outcomes on a rejected save, per #188, and the
// UI must not conflate them: 400 = the write guard fired, NOTHING was written, buffer kept, show
// the _NOT_TEX text verbatim; 409 = the write guard passed but the revision was stale, ALSO nothing
// written, buffer kept, but the message is about the OTHER writer, not the content. A 200 that
// later fails to COMPILE is neither of these — the editor has already closed on the 200, and that
// failure surfaces through the existing #errbar / refreshPdf() poll, untouched by this feature.
function editErr(msg){const e=$('#editerr');e.textContent=msg;e.hidden=!msg;}
async function enterEdit(){
  if(!canEdit||EDITON)return;
  DIFFON=false;   // mutual exclusion: edit always wins, unconditionally
  let text,rev;
  try{
    const r=await fetch(API+'/source',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    text=await r.text();
    // The precondition token comes from THIS response, never a separate /status fetch — reading it
    // out of band is exactly the lost-update ordering #288 forbids.
    rev=(r.headers.get('ETag')||'').replace(/"/g,'');
  }catch(e){toast('Could not load the source for editing');return;}
  editRevision=rev;
  $('#edittext').value=text;
  editErr('');
  EDITON=true;
  syncDiffVisibility();
  $('#edittext').focus();
}
function exitEdit(){
  EDITON=false;
  editErr('');
  syncDiffVisibility();
}
$('#editbtn').addEventListener('click',enterEdit);
$('#editcancel').addEventListener('click',exitEdit);
$('#editsave').addEventListener('click',async()=>{
  const save=$('#editsave'),cancel=$('#editcancel'),markdown=$('#edittext').value;
  save.disabled=true;cancel.disabled=true;save.textContent='Saving…';editErr('');
  let csrf='';
  try{csrf=((await fetch('/auth/session',{cache:'no-store'}).then(r=>r.json()))||{}).csrf||'';}catch(e){}
  let r=null,body=null;
  try{
    r=await fetch(API+'/source',{method:'PUT',headers:{'Content-Type':'application/json',
      'If-Match':'"'+editRevision+'"','X-CSRF-Token':csrf,'X-Mdreview-Client':'viewer'},
      body:JSON.stringify({markdown:markdown})});
    body=await r.json().catch(()=>({}));
  }catch(e){
    save.disabled=false;cancel.disabled=false;save.textContent='Save';
    editErr('Save failed — network error. Your text below is unsaved.');
    return;
  }
  save.disabled=false;cancel.disabled=false;save.textContent='Save';
  if(r.status===200){
    // This write IS the source_updated change the poll would otherwise see as a REMOTE one —
    // seed lastSrc from the response so the next tick does not fire a false "Draft updated by AI"
    // toast over the reviewer's own save (mirrors boot()'s cursor-seeding comment above).
    lastSrc=body.source_updated||lastSrc;
    EDITON=false;editErr('');syncDiffVisibility();
    await loadSource();await refreshDiffAvail();refreshPdf();
    toast('Saved — recompiling…');
    return;
  }
  if(r.status===409){
    // AC: buffer preserved, editor stays open, explicit "changed by the agent" message — never
    // auto-reload, that would be this UI resending nothing while silently discarding the buffer.
    // The buffer below is untouched by THIS failure, but reopening Edit fetches the latest text
    // and REPLACES it (enterEdit always repopulates from the server) — so the warning has to say
    // that plainly, or "Cancel, reopen Edit, re-apply" reads as a safe sequence when it is really
    // "copy your text out first, or reopening will overwrite it".
    editErr('Changed by the agent since you opened the editor. Your text below is unsaved and '
      +'NOT yet lost — but reopening Edit will replace it with the latest version. Copy what you '
      +'want to keep, then Cancel and reopen Edit to see the latest and re-apply it.');
    return;
  }
  if(r.status===400){
    // AC 7a: the #188 guard rejected the body before anything was written. Show its text verbatim
    // (decorator.py's _NOT_TEX is written for exactly this reader) — never invent our own wording.
    editErr((body&&body.error)||'Rejected: not a valid LaTeX document. Nothing was saved.');
    return;
  }
  editErr('Save failed — HTTP '+r.status+'. Your text below is unsaved.');
});
mdKeys.pushEscape(()=>{if(!EDITON)return false;exitEdit();return true;});

// #250 Recompile. Honest, server-driven states (the #213 #pubcopy pattern: await, then say what
// happened). The in-progress label appears only after the POST returns 2xx; a refused POST names
// its reason and re-enables; queued/running is driven by st.state in refreshPdf(), never a client
// timer; and the poll NEVER posts — one explicit click is the only retry path (#250's whole point,
// preserving _self_heal's anti-stacking rule).
$('#recompilebtn').addEventListener('click', async ()=>{
  const b=$('#recompilebtn');
  b.disabled=true;                                   // instant, so a double-click cannot double-post
  let csrf='';
  try{ csrf=((await fetch('/auth/session',{cache:'no-store'}).then(r=>r.json()))||{}).csrf||''; }catch(e){}
  let r=null;
  try{ r=await fetch(LATEX+'/recompile',{method:'POST',headers:{'X-CSRF-Token':csrf}}); }catch(e){}
  if(!r || !r.ok){
    const why = r ? (r.status===401?'sign in required':r.status===404?'not available for this review'
                    :r.status===403?'session expired — reload':r.status===507?'server disk is full'
                    :'HTTP '+r.status) : 'network error';
    toast('Recompile failed — '+why+'. Nothing was queued.');
    b.textContent='Recompile'; b.disabled=false;     // never a fake in-progress state
    return;
  }
  b.textContent='Recompiling…';                       // only AFTER the server said 2xx
  refreshPdf();                                       // pick up queued/running immediately
});

// #dlbtn is deliberately unbound: it downloads a file, and a stray keystroke must not write to disk.
</script>
