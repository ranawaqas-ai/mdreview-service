# Phase 1 production deploy for the Kapture VPS: the mdreview app + an oauth2-proxy sidecar,
# both published to LOOPBACK ONLY. The host's existing nginx is the sole public ingress (see
# nginx/app.waqasrana.space.conf + RUNBOOK-phase1.md).
#
# Two auth planes: the browser goes through oauth2-proxy (Google OAuth cookie); an agent sends a
# per-user Bearer token that nginx passes straight to the app (cookie-or-bearer vhost). Auth is
# MANDATORY here (MDREVIEW_REQUIRE_AUTH=1 + secrets below). The invite allowlist is multi-user.
#
#   docker compose -f infra/deploy/docker-compose.prod.yml --env-file infra/deploy/.env up -d
services:
  mdreview:
    # :latest = auto-update on re-pull (the owner's stated preference). Trade-off: a re-pull can
    # swap the running image, so an EXACT rollback needs a pinned digest (ghcr.io/...@sha256:...).
    # The hosted instance runs the LaTeX-enabled image (ENABLE_LATEX baked in) — this must match live
    # so a redeploy reproduces it (issue #86). The slim ghcr.io/.../mdreview-service:latest is the
    # non-LaTeX variant; do not use it here.
    image: ghcr.io/ranawaqas-ai/mdreview-service-latex:latest
    container_name: mdreview
    restart: unless-stopped
    # LOOPBACK-ONLY publish: nginx reaches this on 127.0.0.1; nothing binds a public interface.
    # If this ever becomes 0.0.0.0 the OAuth gate is bypassed by hitting the host port directly.
    ports:
      - "127.0.0.1:8140:8080"
    volumes:
      - mdreview-prod:/data
    environment:
      # Correct review_url regardless of the Host header. Single canonical domain (issue #86).
      MDREVIEW_PUBLIC_BASE: "https://app.mdreview.space"
      # Phase 1: auth is MANDATORY on the hosted instance. The app boot-guard plus these ${VAR:?}
      # refuse to start if a secret is missing, so this service can NEVER come up wide open (the
      # security-review P0: the cookie-or-bearer nginx in front of an auth-off app = open read/delete).
      MDREVIEW_REQUIRE_AUTH: "1"
      MDREVIEW_PROXY_SECRET: "${MDREVIEW_PROXY_SECRET:?set MDREVIEW_PROXY_SECRET in infra/deploy/.env}"
      MDREVIEW_TOKEN_PEPPER: "${MDREVIEW_TOKEN_PEPPER:?set MDREVIEW_TOKEN_PEPPER in infra/deploy/.env}"
      # #67: signs the app-owned session cookie + magic-link tokens. Now part of the REQUIRE_AUTH
      # boot guard, so it is MANDATORY here (a REQUIRE_AUTH=1 instance refuses to boot without it) and
      # is also required by the future hosted build (python -m mdreview.hosted). Generate once:
      # `openssl rand -hex 32`, then keep it stable (rotating it invalidates every live session).
      MDREVIEW_SESSION_SECRET: "${MDREVIEW_SESSION_SECRET:?set MDREVIEW_SESSION_SECRET in infra/deploy/.env}"
      # Session lifetime (#221). MUST be declared here: this service has no `env_file:`, so a key
      # sitting in .env is only available for ${...} substitution and never reaches the container.
      # Declaring it does NOT change prod on its own: the host runs its own copy of this file, and
      # prod serves the :latest image built from main. It takes effect when the owner syncs this
      # file and recreates the container (owner decision D1). Overrides the 43200 (12h) code default.
      MDREVIEW_SESSION_TTL_S: "${MDREVIEW_SESSION_TTL_S:-2592000}"
      # Reviewer sign-in at /auth/demo (docs/operations/demo-login.md). Name only: the value lives in
      # the host .env. Empty keeps the route off (it then 404s); a set value under 32 chars refuses boot.
      MDREVIEW_DEMO_LOGIN_KEY: "${MDREVIEW_DEMO_LOGIN_KEY:-}"
    networks:
      - mdrnet

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: mdreview-oauth2-proxy
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    # LOOPBACK-ONLY: nginx calls the /oauth2/* endpoints and the /oauth2/auth oracle on 127.0.0.1.
    # Host port 4181 (not 4180): Kapture already runs another oauth2-proxy on 127.0.0.1:4180
    # (kapture-oauth / auth.fikar.ai). Container still listens on 4180 internally.
    ports:
      - "127.0.0.1:4181:4180"
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./oauth2-proxy/invited-emails.txt:/etc/oauth2-proxy/invited-emails.txt:ro
    environment:
      # Secrets come from infra/deploy/.env (gitignored), never from the committed config file.
      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
    networks:
      - mdrnet

# Dedicated network so these two are not on the default bridge with unrelated Kapture containers.
# (oauth2-proxy is only an auth oracle here; it does not proxy to the app, nginx does.)
networks:
  mdrnet:
    driver: bridge

volumes:
  mdreview-prod:
