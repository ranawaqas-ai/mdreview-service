name: pr-checks

# Pre-merge gate for `dev`. Agents self-merge their own PRs (docs/process/README.md, Branching),
# so this is the check standing where the second-party look used to. Deliberately a SEPARATE
# workflow from staging-image.yml rather than a trigger added to it: `on:` is workflow-level, so
# a pull_request trigger there would also run that workflow's `image` job (`needs:` is a
# dependency, not a filter) and publish the PR head as `:dev` — which the staging timer adopts
# within 15 minutes. It would also join that workflow's static `cancel-in-progress` group and
# cancel in-flight `dev` builds.
#
# Both smokes are stdlib-only and build their env inline: no repo secret, no Docker, no host.
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job KEY is the status-check context name (not the workflow name), so this is what to list
  # if `pr-checks` is ever made a required status check on `dev`.
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Guards this file's own safety invariants: no packages scope, no image push, job key
      # unchanged. It runs on the PR head, so a PR that breaks them fails before it can merge.
      - name: pr-checks guard
        run: python3 tests/pr_checks_guard.py

      - name: Hosted boot smoke
        run: python3 tests/hosted_boot_smoke.py

      - name: Custody regression smoke
        run: python3 tests/custody_regression_smoke.py

      # #361: the unowned-record tripwire, exercised against a synthetic fixture. Gated here
      # because a tripwire that silently stops firing is worse than none — the check proves it
      # FAILS on a planted record, so bit-rot surfaces as a red PR rather than as quiet safety.
      - name: Custody tripwire selfcheck
        run: python3 tests/custody_tripwire_selfcheck.py

      # #373: the releases-page generator + its tripwire (scripts/gen_releases_page.py,
      # scripts/releases_page_tripwire.py), against a synthetic fixture. Mutation-tested both
      # ways: a broken generator must be caught by name, and a neutered tripwire must be caught
      # too (the #361 technique), so this pipeline can't quietly rot back to "site says v0.2.0,
      # prod runs v0.5.3" a third time. Stdlib-only, no network.
      - name: Releases page tripwire selfcheck
        run: python3 tests/releases_page_tripwire_selfcheck.py

      # #360: the prod drift check, plus the guard that its hardcoded expected-key list still
      # matches docker-compose.prod.yml. Gated here because without it the list is discipline,
      # not enforcement: someone adds MDREVIEW_FOO to the compose, the tripwire silently stops
      # covering it, and the next twelve-day config gap looks exactly like the last one.
      # CI-safe by construction — it stubs ssh and docker and never reaches a host.
      - name: Prod drift selfcheck
        run: bash tests/drift_prod_selfcheck.sh

      # #266: CSRF on the /account/tokens write arms — cookie plane 403s without the per-session
      # token; the proxy and bearer planes pass unchanged. Stdlib-only, boots its own server.
      - name: Account tokens CSRF selfcheck
        run: python3 tests/account_tokens_csrf_selfcheck.py

      - name: Manual resolve smoke
        run: python3 tests/manual_resolve_smoke.py

      # #144: GET /admin/audit — cookie-plane-admin gate, newest-first, limit + before cursor,
      # raw fields (the stated policy). Stdlib-only, boots its own server.
      - name: Admin audit read selfcheck
        run: python3 tests/admin_audit_selfcheck.py

      # #288: the edit-precondition seam — revision ETag/If-Match + MCP expected_revision 409
      # on stale, no-break when omitted; can_edit on /status; the widened latex override.
      # Stdlib-only, boots its own local + hosted instances.
      - name: Revision precondition selfcheck
        run: python3 tests/revision_precondition_selfcheck.py

      # #289: session-keyed CSRF on PUT /source (verified session 403s without the token; proxy
      # and bearer planes pass unchanged) + the source_updated_by attribution lifecycle
      # (reviewer sets, agent deletes, readers default) + round.json "by". Stdlib-only, boots
      # its own local + hosted instances.
      - name: Source CSRF + attribution selfcheck
        run: python3 tests/source_csrf_attribution_selfcheck.py

      # #267: GET /api/reviews/{id}/shares resolves `email` per named share; a resolvable subject
      # yields the address, an unresolvable one yields "". Stdlib-only, boots its own server.
      - name: Review shares email selfcheck
        run: python3 tests/review_shares_email_selfcheck.py

      # #291: the latex-viewer.html edit UI's exact HTTP contract against a real latex review —
      # If-Match from GET /source, X-Mdreview-Client attribution, the 400-vs-409 distinction (AC
      # 7a/7b) including the guard-wins-over-precondition ordering. Stdlib-only, boots its own
      # local instance.
      - name: Latex edit UI selfcheck
        run: python3 tests/latex_edit_ui_selfcheck.py

      # #284: owned-row share badges (share_public/share_count, additive-default-safe) + the
      # inbound GET /api/reviews?scope=shared whitelist (membership, no public-only leak, D2
      # self-revoke authorized to exactly the caller's own row, D3 local-part-only disclosure) +
      # the local tier stays byte-identical. Stdlib-only, boots its own hosted + local instances.
      # The rendered-outcome half (badges/group actually painting, both themes) is a browser check
      # — tests/share_visibility_ui_selfcheck.sh — deliberately NOT run here: this workflow reads
      # nothing in web/app/** (see the file header), so that check is run by hand each PR.
      - name: Share scope selfcheck
        run: python3 tests/share_scope_selfcheck.py

      # #393: the Claude Code plugin + marketplace manifests. The plugin's wrapper is symlinks into
      # src/, so this catches a stale real copy, a missing manifest field, or a copied install that
      # no longer starts. `claude plugin validate` is stricter but needs the CLI; run it by hand.
      - name: Plugin manifest selfcheck
        run: python3 tests/plugin_manifest_selfcheck.py

      # #394: every MCP tool carries a title and readOnly/destructive/openWorld hints, read from
      # the wrapper's real tools/list. The Connectors Directory rejects an unannotated tool, and
      # clients use the hints to decide which calls need the user's confirmation.
      - name: Tool annotations selfcheck
        run: python3 tests/tool_annotations_selfcheck.py
